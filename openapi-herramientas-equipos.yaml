                    listed: true
                    source: IMPORT
                    status: ACTIVO
                    city: GUAYAQUIL
                    node: AR7S
                    businessType: Combo Tv - Int
                    accountType: Residencial
                    accessType: Sin Registro
                    importedAt: '2026-09-26T21:15:56.833Z'
                    enforce: false
                extra:
                  summary: Cuenta demo (WHITELIST_EXTRA_ACCOUNTS)
                  value:
                    accountNumber: '40123456'
                    listed: true
                    source: EXTRA
                    status: ACTIVO
                    city: null
                    node: null
                    businessType: null
                    accountType: null
                    accessType: null
                    importedAt: '2026-09-26T21:15:56.833Z'
                    enforce: false
                notListed:
                  summary: No listada
                  value:
                    accountNumber: '12345678'
                    listed: false
                    importedAt: '2026-09-26T21:15:56.833Z'
                    enforce: true
                empty:
                  summary: Sin lista importada
                  value:
                    accountNumber: '12345678'
                    listed: null
                    reason: WHITELIST_EMPTY
                    importedAt: null
                    enforce: false
        '400':
