  # ====================================================================
  # TAREAS Y VISITAS (campos 15-16)
  # ====================================================================

  /accounts/{accountNumber}/visits:
    get:
      tags: [Tareas y Visitas]
      summary: Visitas de la cuenta con su resultado (lista unificada)
      description: >
        Todas las órdenes de trabajo de la cuenta, **una entrada por orden**,
        cada una etiquetada con su resultado. Reemplaza a
        `unsatisfactory-tasks` y `previous-visits`.


        Orden de `items`: primero las `PENDIENTE` (orden sin terminar, fecha de
        creación desc) y después el resto por `occurredAt` desc. En FSM una
        cuenta tiene como mucho UNA orden pendiente —la próxima visita—;
        `pendingCount` informa cuántas llegaron (si llega más de una se
        muestran todas y el backend lo registra como anomalía).


        Clasificación:

        - `CANCELADA`: `state` de la orden es "Cancelado" (sin distinguir
          mayúsculas ni tildes). No se abren sus tareas.

        - `PENDIENTE`: la orden no terminó (`endDate` nulo).

        - `INSATISFACTORIA` / `SATISFACTORIA`: las `FSM_ORDERS_MAX_FANOUT`
          (5) órdenes finalizadas no canceladas más recientes se abren con
          `/workorder/tasks`. INSATISFACTORIA si alguna tarea lo es (notas =
          las de esas tareas); si no, SATISFACTORIA (notas = las de la última
          tarea cerrada). `technician` = `lastModifyUser` de esa tarea.
          `notesLoaded: true`.

        - `REALIZADA`: finalizada pero sin verificar — quedó fuera del
          fan-out, o la lectura de sus tareas falló. `notesLoaded: false`; el
          cliente puede pedir las notas con `GET /workorders/tasks?workOrder=`.


        **1 + ≤5 llamadas upstream**, concurrencia `FSM_API_MAX_CONCURRENCY`.
        Un fallo de token en cualquier llamada es 503 `UPSTREAM_AUTH_ERROR`
        (nunca 401).


        **`?include=records` (2026-09-30)** — reemplaza al "historial de la
        app": cada visita trae `records` con lo que se hizo y qué datos arrojó
        (speedtest de la app y del dispositivo externo, ping, traceroute, señal
        WiFi, distancia, equipos retirados y, desde el 2026-09-30, ubicación
        casa cliente `clientLocation`, por `capturedAt`; desde el 2026-10-01,
        validación de equipo vs plan `deviceValidation`, por `createdAt`) y un `checklist` de qué se hizo y
        qué no. Asociación: (1) `taskId` del registro == `workOrder` o
        `fsmTaskId` de la visita (`linkedBy: TASK_ID`); (2) si no, por ventana
        de tiempo de la visita, misma cuenta (`linkedBy: TIME_WINDOW`):
        [creación de la orden, como mucho 72 h antes del fin; fin + 2 h]; la
        pendiente llega hasta ahora + 2 h; si cae en varias gana la de cierre
        más próximo. Las `CANCELADA` solo reciben registros por `taskId`. Solo
        agrega lecturas a la base propia (0 llamadas upstream extra).
      operationId: getVisits
      parameters:
        - $ref: '#/components/parameters/AccountNumberPath'
        - $ref: '#/components/parameters/BrandHeader'
        - $ref: '#/components/parameters/BrandQuery'
        - name: include
          in: query
          required: false
          description: "`records` → cada visita trae sus registros. Otro valor → 400."
          schema:
            type: string
            enum: [records]
      responses:
        '200':
          description: >-
            OK. Una cuenta sin órdenes devuelve `items` vacío. Con
            `include=records` el esquema es `VisitsWithRecordsResult`.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/VisitsResult'
                  - $ref: '#/components/schemas/VisitsWithRecordsResult'
              examples:
                withRecords:
                  summary: include=records — una visita con speedtest externo y ping
                  value:
                    items:
                      - taskId: ORDER/83093/2024
                        workOrder: ORDER/83093/2024
                        occurredAt: '2024-02-29T16:28:56.000Z'
                        reason: TASK/109712/2024
                        closingNotes: Se cambió el patch cord, señal OK.
                        technician: VINCULADO GYE PEREZ JUAN
                        result: SATISFACTORIA
                        notesLoaded: true
                        createdAt: '2024-02-28T21:08:20.000Z'
                        endedAt: '2024-02-29T16:28:56.000Z'
                        fsmTaskId: TASK/109712/2024
                        records:
                          linkedBy: MIXED
                          window: { from: '2024-02-28T21:08:20.000Z', until: '2024-02-29T18:28:56.000Z' }
                          checklist:
                            - { type: speedtest, label: Speedtest (app), done: false, count: 0 }
                            - { type: externalSpeedtest, label: Speedtest (dispositivo externo), done: true, count: 1 }
                            - { type: ping, label: Ping, done: true, count: 1 }
                            - { type: traceroute, label: Traceroute, done: false, count: 0 }
                            - { type: wifiSignal, label: Medición de señal WiFi, done: false, count: 0 }
                            - { type: distance, label: Medición de distancia, done: false, count: 0 }
                            - { type: retiredEquipment, label: Equipos retirados, done: false, count: 0 }
                            - { type: clientLocation, label: Ubicación casa cliente, done: false, count: 0 }
                            - { type: deviceValidation, label: Validación de equipo vs plan, done: false, count: 0 }
                          speedtests:
                            - id: 3f0c7a52-0d7e-4f0e-9a39-3b8a3c1f1a11
                              accountNumber: '35070291'
                              taskId: ORDER/83093/2024
                              createdAt: '2024-02-29T16:10:02.000Z'
                              downloadMbps: 9412.5
                              uploadMbps: 8120.3
                              latencyMs: 3.2
                              jitterMs: 0.4
                              measuredAt: '2024-02-29T16:09:40.000Z'
                              source: external-device
                              deviceName: Tester 10G #1
                              deviceId: AND-10G-0001
                              simulated: true
                              linkedBy: TASK_ID
                          pingTests:
                            - id: 8b1d6c0e-2a55-4c1e-9f7b-5d2e1a0c9b22
