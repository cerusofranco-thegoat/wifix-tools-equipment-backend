openapi: 3.0.3

info:
  title: API de Herramientas y Equipos Retirados
  description: >
    Módulo de backend de la app Wifix (Fase 1). Cubre dos dominios del
    servicio de operaciones de campo:

      1. HERRAMIENTAS — almacenamiento de resultados de mediciones:
         medición de distancia, test de velocidad, mapa de calor WiFi,
         ping y traceroute.
      2. EQUIPOS RETIRADOS — registro de equipos retirados o reemplazados.

    CLAVE DE IDENTIFICACIÓN (FASE 1)
    ----------------------------------------------------------------------
    En la Fase 1 la clave práctica de cada registro es `accountNumber`:
    el número de cuenta del cliente que el técnico ingresa en la app.
    Los demás identificadores (`clientId`, `visitId`, `technicianId`) son
    opcionales: provendrán de un sistema upstream aún por definir y en la
    Fase 1 se completan con valores de prueba. `contractId` también es
    opcional y en una fase posterior será reemplazado por `taskId`.

    AUTENTICACIÓN
    ----------------------------------------------------------------------
    La app tiene login propio. POST /auth/login devuelve un JWT que el
    resto de endpoints exige en el header Authorization: Bearer.

    DATOS DE SISTEMAS EXTERNOS (MOCKUP)
    ----------------------------------------------------------------------
    Los campos que provienen de sistemas de la operadora (Comarch/TYTAN,
    FSM, ISP Monitor, ACS, TEC, RMS) se sirven en esta etapa con datos
    simulados, para demostrar y probar la app. El contrato no cambia
    cuando se conecten las APIs reales.
  version: 1.0.0
  contact:
    name: Tulpa Solutions S.A.S.

servers:
  - url: https://api.ejemplo.com/herramientas/v1
    description: Producción (URL definitiva por coordinar)
  - url: http://localhost:8080/herramientas/v1
    description: Desarrollo local

tags:
  - name: Catálogos
    description: Datos de referencia de solo lectura.
  - name: Medición de Distancia
    description: Herramienta de odómetro GPS (campo 22).
  - name: Test de Velocidad
    description: Resultados de speedtest (campo 23).
  - name: Mapa de Calor WiFi
    description: Mediciones de potencia de señal WiFi por habitación (campo 24).
  - name: Ping
    description: Resultados de pruebas de ping (campo 25).
  - name: Traceroute
    description: Resultados de pruebas de traceroute (campo 26).
  - name: Equipos Retirados
    description: Registro de equipos retirados o reemplazados (campo 27).
  - name: Media
    description: Subida de archivos (fotos de código de barras, etc.).
  - name: Historial de la Cuenta
    description: Consulta agregada de los registros de este módulo por cuenta.
  - name: Autenticación
    description: Login de la app y emisión de token.
  - name: Datos del Cliente
    description: Perfil, status y actualización de datos del cliente (campos 1-5, 7).
  - name: Diagnóstico de Red
    description: >
      NAPs, métricas de red, eventos de la red de acceso y red local
      (campos 6, 8-14, 19-21).
  - name: Tareas y Visitas
    description: >
      Tareas insatisfactorias, visitas anteriores, órdenes y notas de cierre
      (campos 15-16).
  - name: Integraciones
    description: >
      Diagnóstico de la integración con FSM (`fsm-data-ms`) y consultas en lote.
  - name: Validación de Equipo
    description: >
      Catálogo de equipos homologados y validación del equipo a instalar contra
      la velocidad del plan contratado (Instalaciones, Migraciones, Visita técnica).

security:
  - bearerAuth: []

paths:

  # ====================================================================
  # AUTENTICACIÓN
  # ====================================================================

  /auth/login:
    post:
      tags: [Autenticación]
      summary: Iniciar sesión
      description: Valida correo y contraseña y devuelve un JWT.
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/me:
    get:
      tags: [Autenticación]
      summary: Datos del usuario autenticado
      operationId: getCurrentUser
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ====================================================================
  # CATÁLOGOS
  # ====================================================================

  /catalogs/speedtest-servers:
    get:
      tags: [Catálogos]
      summary: Lista de servidores de test de velocidad
      operationId: listSpeedtestServers
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SpeedtestServer'

  /catalogs/network-servers:
    get:
      tags: [Catálogos]
      summary: Lista de servidores comunes para ping y traceroute
      operationId: listNetworkServers
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/NetworkServer'

  /catalogs/equipment-models:
    get:
      tags: [Catálogos]
      summary: Lista de modelos de equipo
      description: >
        Modelos de equipo con el tipo de campo de serie que debe leerse
        del código de barras (SN, HOST-SN, PON-SN, GPON-SN, D-SN).
      operationId: listEquipmentModels
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EquipmentModel'

  /catalogs/removal-reasons:
    get:
      tags: [Catálogos]
      summary: Lista de motivos de retiro
      operationId: listRemovalReasons
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RemovalReason'

  # ====================================================================
  # HERRAMIENTAS — MEDICIÓN DE DISTANCIA (campo 22)
  # ====================================================================

  /distance-measurements:
    get:
      tags: [Medición de Distancia]
      summary: Lista de mediciones de distancia
      operationId: listDistanceMeasurements
      parameters:
        - $ref: '#/components/parameters/AccountNumberFilter'
        - $ref: '#/components/parameters/ClientIdFilter'
        - $ref: '#/components/parameters/VisitIdFilter'
        - $ref: '#/components/parameters/TechnicianIdFilter'
        - $ref: '#/components/parameters/TaskIdFilter'
        - $ref: '#/components/parameters/DateFrom'
        - $ref: '#/components/parameters/DateTo'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PagedResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/DistanceMeasurement'
    post:
      tags: [Medición de Distancia]
      summary: Registrar una medición de distancia
      operationId: createDistanceMeasurement
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DistanceMeasurementInput'
      responses:
        '201':
          description: Creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DistanceMeasurement'
        '400':
          $ref: '#/components/responses/BadRequest'

  /distance-measurements/{id}:
    get:
      tags: [Medición de Distancia]
      summary: Obtener una medición de distancia
      operationId: getDistanceMeasurement
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DistanceMeasurement'
        '404':
          $ref: '#/components/responses/NotFound'

  # ====================================================================
  # HERRAMIENTAS — TEST DE VELOCIDAD (campo 23)
  # ====================================================================

  /speedtests:
    get:
      tags: [Test de Velocidad]
      summary: Lista de tests de velocidad
      operationId: listSpeedtests
      parameters:
        - $ref: '#/components/parameters/AccountNumberFilter'
        - $ref: '#/components/parameters/ClientIdFilter'
        - $ref: '#/components/parameters/ContractIdFilter'
        - $ref: '#/components/parameters/VisitIdFilter'
        - $ref: '#/components/parameters/TechnicianIdFilter'
        - $ref: '#/components/parameters/TaskIdFilter'
        - $ref: '#/components/parameters/DateFrom'
        - $ref: '#/components/parameters/DateTo'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PagedResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Speedtest'
    post:
      tags: [Test de Velocidad]
      summary: Registrar un test de velocidad
      operationId: createSpeedtest
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SpeedtestInput'
      responses:
        '201':
          description: Creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Speedtest'
        '400':
          $ref: '#/components/responses/BadRequest'

  /speedtests/{id}:
    get:
      tags: [Test de Velocidad]
      summary: Obtener un test de velocidad
      operationId: getSpeedtest
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Speedtest'
        '404':
          $ref: '#/components/responses/NotFound'

  # ====================================================================
  # HERRAMIENTAS — MAPA DE CALOR WIFI (campo 24)
  # ====================================================================

  /wifi-heatmaps:
    get:
      tags: [Mapa de Calor WiFi]
      summary: Lista de mapas de calor WiFi
      operationId: listWifiHeatmaps
      parameters:
        - $ref: '#/components/parameters/AccountNumberFilter'
        - $ref: '#/components/parameters/ClientIdFilter'
        - $ref: '#/components/parameters/VisitIdFilter'
        - $ref: '#/components/parameters/TechnicianIdFilter'
        - $ref: '#/components/parameters/TaskIdFilter'
        - $ref: '#/components/parameters/DateFrom'
        - $ref: '#/components/parameters/DateTo'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PagedResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/WifiHeatmap'
    post:
      tags: [Mapa de Calor WiFi]
      summary: Registrar un mapa de calor WiFi
      description: >
        Crea un relevamiento de cobertura WiFi con una o más mediciones
        por habitación. Si la vivienda tiene un solo piso se usa floor = 1.
      operationId: createWifiHeatmap
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WifiHeatmapInput'
      responses:
        '201':
          description: Creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WifiHeatmap'
        '400':
          $ref: '#/components/responses/BadRequest'

  /wifi-heatmaps/{id}:
    get:
      tags: [Mapa de Calor WiFi]
      summary: Obtener un mapa de calor WiFi
      operationId: getWifiHeatmap
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WifiHeatmap'
        '404':
          $ref: '#/components/responses/NotFound'

  /accounts/{accountNumber}/wifi-access-points:
    parameters:
      - $ref: '#/components/parameters/AccountNumberPath'
    get:
      tags: [Mapa de Calor WiFi]
      summary: Listar APs WiFi registrados de una cuenta
      description: >
        APs (router, extensores, nodos mesh) que el técnico identificó en
        visitas anteriores de esta cuenta. El frontend los usa para
        pre-cargar nombres por BSSID al iniciar un nuevo relevamiento.
      operationId: listAccountWifiAccessPoints
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WifiAccessPoint'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Mapa de Calor WiFi]
      summary: Registrar (o actualizar) un AP WiFi de la cuenta
      description: >
        Crea un `WifiAccessPoint` para la cuenta. Si ya existe uno con el
        mismo `bssid` para esta cuenta, el servidor lo actualiza
        (upsert por `accountNumber` + `bssid`).
      operationId: createAccountWifiAccessPoint
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WifiAccessPointInput'
      responses:
        '201':
          description: Creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WifiAccessPoint'
        '200':
          description: Actualizado (upsert)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WifiAccessPoint'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /wifi-access-points/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    patch:
      tags: [Mapa de Calor WiFi]
      summary: Renombrar o corregir un AP WiFi
      operationId: updateWifiAccessPoint
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WifiAccessPointUpdate'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WifiAccessPoint'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  # ====================================================================
  # HERRAMIENTAS — PING (campo 25)
  # ====================================================================

  /ping-tests:
    get:
      tags: [Ping]
      summary: Lista de pruebas de ping
      operationId: listPingTests
      parameters:
        - $ref: '#/components/parameters/AccountNumberFilter'
        - $ref: '#/components/parameters/ClientIdFilter'
        - $ref: '#/components/parameters/VisitIdFilter'
        - $ref: '#/components/parameters/TechnicianIdFilter'
        - $ref: '#/components/parameters/TaskIdFilter'
        - $ref: '#/components/parameters/DateFrom'
        - $ref: '#/components/parameters/DateTo'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PagedResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/PingTest'
    post:
      tags: [Ping]
      summary: Registrar una prueba de ping
      description: >
        Almacena el resultado de un ping. Puede asociarse opcionalmente a
        una habitación de un mapa de calor mediante heatmapId y roomName.
      operationId: createPingTest
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PingTestInput'
      responses:
        '201':
          description: Creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PingTest'
        '400':
          $ref: '#/components/responses/BadRequest'

  /ping-tests/{id}:
    get:
      tags: [Ping]
      summary: Obtener una prueba de ping
      operationId: getPingTest
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PingTest'
        '404':
          $ref: '#/components/responses/NotFound'

  # ====================================================================
  # HERRAMIENTAS — TRACEROUTE (campo 26)
  # ====================================================================

  /traceroute-tests:
    get:
      tags: [Traceroute]
      summary: Lista de pruebas de traceroute
      operationId: listTracerouteTests
      parameters:
        - $ref: '#/components/parameters/AccountNumberFilter'
        - $ref: '#/components/parameters/ClientIdFilter'
        - $ref: '#/components/parameters/VisitIdFilter'
        - $ref: '#/components/parameters/TechnicianIdFilter'
        - $ref: '#/components/parameters/TaskIdFilter'
        - $ref: '#/components/parameters/DateFrom'
        - $ref: '#/components/parameters/DateTo'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PagedResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/TracerouteTest'
    post:
      tags: [Traceroute]
      summary: Registrar una prueba de traceroute
      operationId: createTracerouteTest
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TracerouteTestInput'
      responses:
        '201':
          description: Creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TracerouteTest'
        '400':
          $ref: '#/components/responses/BadRequest'

  /traceroute-tests/{id}:
    get:
      tags: [Traceroute]
      summary: Obtener una prueba de traceroute
      operationId: getTracerouteTest
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TracerouteTest'
        '404':
          $ref: '#/components/responses/NotFound'

  # ====================================================================
  # EQUIPOS RETIRADOS (campo 27)
  # ====================================================================

  /retired-equipment:
    get:
      tags: [Equipos Retirados]
      summary: Lista de equipos retirados
      operationId: listRetiredEquipment
      parameters:
        - $ref: '#/components/parameters/AccountNumberFilter'
        - $ref: '#/components/parameters/ClientIdFilter'
        - $ref: '#/components/parameters/VisitIdFilter'
        - $ref: '#/components/parameters/TechnicianIdFilter'
        - $ref: '#/components/parameters/TaskIdFilter'
        - name: removalReasonCode
          in: query
          description: Filtrar por código de motivo de retiro.
          schema:
            $ref: '#/components/schemas/RemovalReasonCode'
        - name: serialValue
          in: query
          description: Buscar por número de serie del equipo.
          schema:
            type: string
        - $ref: '#/components/parameters/DateFrom'
        - $ref: '#/components/parameters/DateTo'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PagedResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/RetiredEquipment'
    post:
      tags: [Equipos Retirados]
      summary: Registrar un equipo retirado o reemplazado
      description: >
        La foto del código de barras se sube previamente con POST /media y
        aquí se referencia por barcodePhotoId. El número de serie llega ya
        decodificado por la app (campo a leer definido según el modelo).
      operationId: createRetiredEquipment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RetiredEquipmentInput'
      responses:
        '201':
          description: Creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetiredEquipment'
        '400':
          $ref: '#/components/responses/BadRequest'

  /retired-equipment/{id}:
    get:
      tags: [Equipos Retirados]
      summary: Obtener un equipo retirado
      operationId: getRetiredEquipment
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetiredEquipment'
        '404':
          $ref: '#/components/responses/NotFound'

  # ====================================================================
  # MEDIA
  # ====================================================================

  /media:
    post:
      tags: [Media]
      summary: Subir un archivo
      description: >
        Sube una imagen (por ejemplo la foto del código de barras) y
        devuelve un identificador y una URL para referenciarla luego.
      operationId: uploadMedia
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: Archivo a subir (JPEG o PNG).
      responses:
        '201':
          description: Creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaFile'
        '400':
          $ref: '#/components/responses/BadRequest'

  /media/{id}:
    get:
      tags: [Media]
      summary: Obtener metadatos de un archivo
      operationId: getMedia
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaFile'
        '404':
          $ref: '#/components/responses/NotFound'

  # ====================================================================
  # HISTORIAL DE LA CUENTA
  # ====================================================================

  /accounts/{accountNumber}/tool-history:
    get:
      tags: [Historial de la Cuenta]
      summary: Historial agregado de una cuenta
      description: >
        Devuelve, en una sola respuesta, los registros de este módulo
        asociados a un número de cuenta: mediciones de distancia, tests de
        velocidad, mapas de calor, pings, traceroutes y equipos retirados.


        **DEPRECADO (2026-09-30)** para la UI del "historial de la app": lo
        reemplaza `GET /accounts/{accountNumber}/visits?include=records`, que
        muestra esos mismos registros dentro de cada visita. Sigue funcionando
        sin cambios para el APK ya instalado.
      operationId: getAccountToolHistory
      parameters:
        - name: accountNumber
          in: path
          required: true
          description: Número de cuenta del cliente.
          schema:
            type: string
        - $ref: '#/components/parameters/DateFrom'
        - $ref: '#/components/parameters/DateTo'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountToolHistory'

  # ====================================================================
  # DATOS DEL CLIENTE (campos 1-5, 7)
  # ====================================================================

  /accounts/{accountNumber}/client-profile:
    parameters:
      - $ref: '#/components/parameters/AccountNumberPath'
    get:
      tags: [Datos del Cliente]
      summary: Perfil del cliente
      description: >
        Nombres, dirección, teléfonos, plan y velocidad contratada
        (campos 1, 2, 3, 5). **Respuesta compuesta** (ADR-07): la identidad sale
        de FSM `POST /account/process` (1 llamada upstream) y el plan/velocidad
        siguen viniendo del mock de Comarch, porque `fsm-data-ms` no los expone.
        El bloque `sources` dice, campo por campo, de dónde salió cada dato.
        Lo editado con el PUT manda sobre FSM y se marca como `MOCK`.


        **Con `CONNECTOR_MODE_FSM=real` la identidad nunca se inventa**
        (2026-09-26): lo que FSM no trae va `null` con `sources.<campo>: NONE`.
        El nombre tiene respaldo en la whitelist de clientes Xtrim
        (`sources.fullName: WHITELIST`). Si FSM no trajo identidad alguna, la
        respuesta es 200 con `degraded.reason: FSM_NO_DATA` (también en el
        header `X-Wifix-Degraded`) y mensaje `Sin datos en FSM para esta
        cuenta.` o `Sin datos en FSM para esta cuenta; nombre tomado de la base
        de clientes Xtrim.`. Plan y velocidad siguen `MOCK`. En `mock` y
        `fixture` no cambia nada (404 si la cuenta no tiene órdenes).
      operationId: getClientProfile
      parameters:
        - $ref: '#/components/parameters/BrandHeader'
        - $ref: '#/components/parameters/BrandQuery'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientProfile'
              examples:
                fsmNoDataWhitelist:
                  summary: FSM real sin órdenes, nombre desde la whitelist
                  value:
                    accountNumber: '105450235'
                    fullName: NOMBRE DEL CLIENTE
                    address: null
                    phones: null
                    planName: Plan Hogar 300
                    contractedDownloadMbps: 300
                    contractedUploadMbps: 300
                    email: null
                    latitude: null
                    longitude: null
                    sources:
                      fullName: WHITELIST
                      address: NONE
                      phones: NONE
                      email: NONE
                      latitude: NONE
                      longitude: NONE
                      planName: MOCK
                      contractedDownloadMbps: MOCK
                      contractedUploadMbps: MOCK
                    degraded:
                      reason: FSM_NO_DATA
                      message: Sin datos en FSM para esta cuenta; nombre tomado de la base de clientes Xtrim.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: >-
            Solo en `mock`/`fixture`: la cuenta no existe en FSM
            (`/account/process` devolvió una lista de órdenes vacía). Con FSM
            `real` nunca es 404 (ver `FSM_NO_DATA`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          $ref: '#/components/responses/ConnectorError'
        '503':
          $ref: '#/components/responses/UpstreamAuthUnavailable'
    put:
      tags: [Datos del Cliente]
      summary: Actualizar datos del cliente
      description: >
        Módulo de actualización de datos (campo 4). **No cambia con la
        integración FSM**: `fsm-data-ms` es de solo lectura, así que la edición
        se guarda en Comarch y el cambio NO viaja a la operadora. Devuelve el
        mismo shape que el GET, con `sources` en `MOCK` para lo editado. Con
        FSM `real`, lo no editado se compone como en el GET (FSM → whitelist
        para el nombre → `null`/`NONE`), nunca con el mock; si FSM falla, lo no
        editado va `null` y el guardado no falla.
      operationId: updateClientProfile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClientProfileUpdate'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientProfile'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /accounts/{accountNumber}/contract-status:
    get:
      tags: [Datos del Cliente]
      summary: Status del cliente por contrato/cuenta
      description: >
        Nombre del cliente y status de la cuenta (campo 7). Origen: FSM
        `POST /account/status` (código A/S/T/O/P) + `POST /account/process`
        (nombre y última orden). **2 llamadas upstream**, ambas cacheadas
        (status 5 min, process 60 s).


        FSM no devuelve "otras cuentas del mismo contrato": `accounts` trae
        exactamente un elemento hasta que exista ese endpoint.
      operationId: getContractStatus
      parameters:
        - $ref: '#/components/parameters/AccountNumberPath'
        - $ref: '#/components/parameters/BrandHeader'
        - $ref: '#/components/parameters/BrandQuery'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContractStatus'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '502':
          $ref: '#/components/responses/ConnectorError'
        '503':
          $ref: '#/components/responses/UpstreamAuthUnavailable'

  # ====================================================================
  # DIAGNÓSTICO DE RED (campos 6, 8-14, 19-21)
  # ====================================================================

  /naps/nearby:
    get:
      tags: [Diagnóstico de Red]
      summary: NAPs cercanas a una coordenada
      description: >
        NAPs cercanas con coordenada, distancia en metros y puertos
        ocupados/libres (campo 6). La consulta es por coordenada (GPS del
        técnico o de la tarea), no por número de cuenta, igual que la
        pestaña "GPON" de FSM. **1 llamada upstream.**


        La fuente la decide `NAPS_PRIMARY_SOURCE` (ADR-04): FSM
        `GET /naps/nearest` o TEC `GET /api/tec/naps/{lat},{lng}` (Digest).
        Con FSM primario, si el token de la operadora falla se cae a TEC y se
        responde 200 con `source:"TEC"` y el aviso en el header
        `X-Wifix-Degraded`. Cualquier otro fallo de FSM se propaga como 502.


        ⚠ La respuesta es un **array desnudo**: por eso el bloque `degraded`
        viaja en el header `X-Wifix-Degraded` (JSON URL-encoded) y no en el
        cuerpo.
      operationId: getNearbyNaps
      parameters:
        - name: lat
          in: query
          required: true
          description: Latitud desde la que se busca.
          schema:
            type: number
            format: double
            minimum: -90
            maximum: 90
        - name: lng
          in: query
          required: true
          description: Longitud desde la que se busca.
          schema:
            type: number
            format: double
            minimum: -180
            maximum: 180
        - name: meters
          in: query
          required: false
          description: Radio de búsqueda en metros. Se ignora si la fuente efectiva es TEC.
          schema:
            type: integer
            minimum: 1
            maximum: 2000
            default: 100
        - name: maxRows
          in: query
          required: false
          description: >
            Cantidad máxima de NAPs. Se ignora si la fuente efectiva es TEC.
            La operadora pidió (2026-09-09) pedir solo la NAP más cercana a las
            coordenadas del cliente: el default es conservador (3). El tope de
            25 se mantiene para quien pida más filas a propósito.
          schema:
            type: integer
            minimum: 1
            maximum: 25
            default: 3
        - $ref: '#/components/parameters/BrandHeader'
        - $ref: '#/components/parameters/BrandQuery'
      responses:
        '200':
          description: OK. Lista ordenada por distancia ascendente (vacía si no hay NAPs en el sector).
          headers:
            X-Wifix-Degraded:
              description: >
                Presente solo si la respuesta se sirvió con una fuente
                alternativa o incompleta. Contiene el JSON del bloque
                `Degraded` URL-encoded. El cliente nunca debe asumir que existe.
              schema:
                type: string
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/NearbyNap'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '502':
          $ref: '#/components/responses/ConnectorError'
        '503':
          $ref: '#/components/responses/UpstreamAuthUnavailable'

  /naps/{napRef}/ports:
    get:
      tags: [Diagnóstico de Red]
      summary: Puertos ocupados por NAP (campo 8, paso 1)
      description: >
        Rejilla de puertos de la NAP con la cuenta y el equipo GPON de cada
        puerto ocupado (campo 8). **1 sola llamada upstream**
        (`GET /naps/accounts`): los estados A/S/T/O/P NO se consultan acá.
        Cada puerto ocupado viene con `clientStatus: null` y
        `statusPending: true`; el técnico los resuelve después, de forma
        explícita, con `POST /accounts/status-batch` (ADR-05).


        **Ruteo del path param**: si `napRef` es numérico (`/^\d+$/`) se toma
        como `napId` de FSM; cualquier otro valor se toma como código de NAP y
        va por el camino TEC heredado, que sigue devolviendo
        `detailAvailable:false`. El frontend envía `nap.napId ?? nap.napCode`.
      operationId: getNapPorts
      parameters:
        - name: napRef
          in: path
          required: true
          description: >
            Id numérico de la NAP en FSM, o código de NAP (camino TEC).
          schema:
            type: string
            example: '11547'
        - name: withStatus
          in: query
          required: false
          description: >
            Resuelve además hasta `batchLimit` estados en la misma llamada.
            Existe SOLO para `probe-fsm-api.ts` y soporte: **la webapp tiene
            prohibido enviarlo**, porque dispara hasta 12 consultas extra a
            producción por cada tap.
          schema:
            type: string
            enum: ['0', '1']
            default: '0'
        - $ref: '#/components/parameters/BrandHeader'
        - $ref: '#/components/parameters/BrandQuery'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NapPorts'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '502':
          $ref: '#/components/responses/ConnectorError'
        '503':
          $ref: '#/components/responses/UpstreamAuthUnavailable'

  /accounts/{accountNumber}/current-nap:
    get:
      tags: [Diagnóstico de Red]
      summary: NAP y puerto en los que está conectada la cuenta
      description: >
        Identifica la NAP, el puerto y el equipo GPON de la cuenta por
        **búsqueda inversa**: FSM no expone el dato directo.


        Algoritmo:

        1. Coordenada: `lat`/`lng` de override si vienen; si no, la del cliente
           en FSM `/account/process` (mismo camino y cache que client-profile).
           Sin coordenada → `found:false, reason:NO_COORDS`.

        2. FSM `/naps/nearest` con `meters=150`, `maxRows=3`.

        3. FSM `/naps/accounts?id=` de cada NAP, **secuencial y por cercanía**,
           cortando en cuanto aparece la cuenta (comparación normalizada como
           string). Si no aparece en ninguna → `reason:NOT_FOUND`.

        4. Si se encontró: estado de la cuenta por el mismo camino que
           `POST /accounts/status-batch` (`/account/status`, cache 5 min). Si
           ESA consulta falla, igual se responde `found:true` con
           `clientStatus:null` y un bloque `degraded` (`FSM_UNAVAILABLE`).


        **Presupuesto upstream: [1 process] + 1 nearest + ≤3 accounts + [1
        status]** (máximo 6; 4 con override de coordenada y hallazgo en la
        primera NAP). El resultado completo se cachea **10 minutos** por marca
        y cuenta (y por coordenada redondeada si vino override); las respuestas
        con `degraded` no se cachean.


        Con `NAPS_PRIMARY_SOURCE=tec` responde `found:false,
        reason:NOT_SUPPORTED` sin ninguna llamada: TEC no expone las cuentas de
        una NAP. Un fallo de token de FSM es **503 `UPSTREAM_AUTH_ERROR`**
        (nunca 401) y no cae a TEC; un 5xx/timeout de FSM al leer la
        coordenada es 503 `UPSTREAM_UNAVAILABLE`, y en `/naps/*` 502
        `CONNECTOR_ERROR`, igual que las rutas vecinas.


        En `CONNECTOR_MODE_FSM=mock` las cuentas `35070291` (2ª NAP más
        cercana) y `40123456` (la más cercana) se encuentran; cualquier otra
        sale `NOT_FOUND`. En `fixture`, `35070291` sale `NOT_FOUND` (no está en
        la NAP grabada).


        **NAP asignada siempre (default, `fallback=simulated`).** En Visita
        técnica y Migraciones el cliente YA tiene una NAP contratada: el
        técnico no busca NAPs. Si la búsqueda real no la identifica
        (`NOT_FOUND`, `NO_COORDS`, `NOT_SUPPORTED`) o FSM falla (token →
        `UPSTREAM_AUTH_ERROR`, 5xx/timeout → `UPSTREAM_UNAVAILABLE`), responde
        **200** con una NAP asignada **simulada**, determinística por cuenta
        (misma cuenta → mismo código, puertos y puerto), con `found:true`,
        `simulated:true`, `source:SIMULATED`, `nap.source:SIMULATED`,
        `nap.napId:null`, `equipmentId:null` y `simulationReason`. La NAP queda
        a 15-120 m del domicilio (o del override) si se conoce; si no,
        alrededor del clúster de los mocks. Cero llamadas extra: la búsqueda
        real, su presupuesto y su cache no cambian. Si la causa fue un fallo de
        FSM viene además `degraded` (`FSM_AUTH` / `FSM_UNAVAILABLE`).
        **No pedir `/naps/{napRef}/ports` de una NAP simulada.**


        `fallback=none` devuelve el comportamiento estricto anterior
        (`found:false` con `reason`, o 503).
      operationId: getCurrentNap
      parameters:
        - $ref: '#/components/parameters/AccountNumberPath'
        - name: lat
          in: query
          required: false
          description: >
            Override de la latitud (p. ej. GPS del técnico). Va junto con
            `lng`: enviar solo uno de los dos es 400.
          schema:
            type: number
            format: double
            minimum: -90
            maximum: 90
        - name: lng
          in: query
          required: false
          description: Override de la longitud. Va junto con `lat`.
          schema:
            type: number
            format: double
            minimum: -180
            maximum: 180
        - name: fallback
          in: query
          required: false
          description: >
            `simulated` (default): si no se identifica la NAP real, la asignada
            simulada. `none`: estricto (`found:false` / 503), como antes.
          schema:
            type: string
            enum: [simulated, none]
            default: simulated
        - $ref: '#/components/parameters/BrandHeader'
        - $ref: '#/components/parameters/BrandQuery'
      responses:
        '200':
          description: >
            OK. `found:false` NO es un error: `reason` dice por qué.
          headers:
            X-Wifix-Degraded:
              description: >
                Presente solo si la respuesta trae `degraded` (mismo JSON,
                URL-encoded).
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentNap'
              examples:
                found:
                  summary: Encontrada (mock, cuenta 35070291)
                  value:
                    accountNumber: '35070291'
                    found: true
                    nap:
                      napId: 11197
                      napCode: PL53KD8
                      networkName: OLT-GYE-06/1/2
                      latitude: -2.243528
                      longitude: -79.906654
                      distanceMeters: 98.1
                      occupiedPorts: 15
                      totalPorts: 16
                      freePorts: 1
                      source: FSM
                    portNumber: 7
                    equipmentId: ZTEGD434832
                    clientStatus:
                      code: A
                      name: ACTIVA
                      description: Activo
                    searchedNaps: 2
                    brand: telenews
                    source: FSM
                    simulated: false
                    assignment: CONTRACTED
                simulated:
                  summary: NAP asignada simulada (no se identificó la real)
                  value:
                    accountNumber: '12345678'
                    found: true
                    nap:
                      napId: null
                      napCode: PL26KD2
                      networkName: OLT-GYE-01/1/4
                      latitude: -2.256763
                      longitude: -79.895559
                      distanceMeters: 35.6
                      occupiedPorts: 13
                      totalPorts: 16
                      freePorts: 3
                      source: SIMULATED
                    portNumber: 9
                    equipmentId: null
                    clientStatus:
                      code: A
                      name: ACTIVA
                      description: Activo (simulado)
                    searchedNaps: 0
                    brand: telenews
                    source: SIMULATED
                    simulated: true
                    assignment: CONTRACTED
                    simulationReason: NOT_FOUND
                notFound:
                  summary: No encontrada en las NAPs cercanas (solo con fallback=none)
                  value:
                    accountNumber: '12345678'
                    found: false
                    nap: null
                    portNumber: null
                    equipmentId: null
                    clientStatus: null
                    searchedNaps: 3
                    reason: NOT_FOUND
                    brand: telenews
                    source: null
                    simulated: false
                    assignment: null
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '502':
          $ref: '#/components/responses/ConnectorError'
        '503':
          $ref: '#/components/responses/UpstreamAuthUnavailable'

  /accounts/{accountNumber}/client-location:
    post:
      tags: [Datos del Cliente]
      summary: Guarda la ubicación "Casa cliente" capturada por el técnico
      description: >
        El técnico captura su GPS (o marca el punto a mano) en el domicilio del
        cliente y queda **guardado** como "Casa cliente", vinculado a la NAP
        del cliente, para que un gerente lo compare con la ubicación que la
        operadora tiene registrada y ubique la casa exacta.


        **Append-only**: cada captura es una fila nueva; nunca se sobrescribe
        (no hay PUT/PATCH/DELETE). Se guarda el usuario (JWT) que capturó.


        Al guardar se toma una **foto**:

        - `registeredLocation`: coordenada del cliente en FSM
          `/account/process` (la del cliente o, si no viene, la de la orden más
          reciente que la tenga; cache 60 s compartido con client-profile).
          `source:FSM` (o `MOCK` con `CONNECTOR_MODE_FSM=mock`). TEC **no**
          expone el domicilio y la whitelist no guarda coordenadas (LOPDP): si
          FSM no la trae o no responde, `null`.

        - NAP: `napCode`/`napPort` enviados o, si no vienen, los de
          `GET /accounts/{accountNumber}/current-nap` (real o asignada
          simulada; cache 10 min). `napLocation` y `distanceToNapMeters` solo
          si el código coincide con el de current-nap; `napLocation.simulated`
          dice si esa NAP era la simulada.

        - Distancias con Haversine, en metros (0,1 m).


        Un fallo de FSM **nunca** impide guardar. La cuenta se guarda
        normalizada (`035070291` → `35070291`). Las coordenadas no se escriben
        en los logs.
      operationId: createClientLocation
      parameters:
        - $ref: '#/components/parameters/AccountNumberPath'
        - $ref: '#/components/parameters/BrandHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClientLocationInput'
            examples:
              gps:
                summary: GPS del técnico durante la visita
                value:
                  latitude: -2.24801
                  longitude: -79.90422
                  accuracyMeters: 6.5
                  source: GPS
                  taskId: ORDER/424900/2026
                  notes: Portón verde, junto a la tienda.
              manual:
                summary: Punto marcado a mano, con NAP y puerto explícitos
                value:
                  latitude: -2.24795
                  longitude: -79.90418
                  label: CASA_CLIENTE
                  source: MANUAL
                  napCode: PL53KD8
                  napPort: 7
                  capturedAt: '2026-09-30T15:40:00.000Z'
      responses:
        '201':
          description: Captura guardada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientLocation'
              examples:
                created:
                  value:
                    id: 6d1f0b2e-8c3a-4d7e-9b1a-2f4c5e6a7b80
                    accountNumber: '35070291'
                    label: CASA_CLIENTE
                    latitude: -2.24801
                    longitude: -79.90422
                    accuracyMeters: 6.5
                    source: GPS
                    napCode: PL53KD8
                    napPort: 7
                    taskId: ORDER/424900/2026
                    capturedAt: '2026-09-30T15:42:10.000Z'
                    createdAt: '2026-09-30T15:42:11.204Z'
                    capturedBy:
                      id: 0b7e7a3c-1f2d-4c5b-8e9a-3d2c1b0a9f87
                      email: tecnico@wifix.test
                    registeredLocation:
                      latitude: -2.2446170
                      longitude: -79.9051330
                      source: FSM
                    distanceToRegisteredMeters: 385.4
                    distanceToNapMeters: 507.9
                    napLocation:
                      latitude: -2.243528
