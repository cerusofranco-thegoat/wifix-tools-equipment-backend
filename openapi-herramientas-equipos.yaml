  /accounts/{accountNumber}/orders:
    get:
      tags: [Tareas y Visitas]
      summary: Órdenes de trabajo de la cuenta
      description: >
        Órdenes crudas normalizadas de FSM `POST /account/process`
        (base de los campos 1-3, 15 y 16; también sirve de diagnóstico).
        **1 llamada upstream.** No devuelve 404: una cuenta sin órdenes es un
        `orders: []` legítimo.
      operationId: getAccountOrders
      parameters:
        - $ref: '#/components/parameters/AccountNumberPath'
        - name: estado
          in: query
          required: false
          description: >
            `Todas`: finalizadas y no finalizadas. `Pendientes`: solo las que
            aún no finalizan (`finish_date is null`).
          schema:
            type: string
            enum: [Todas, Pendientes]
            default: Todas
        - $ref: '#/components/parameters/BrandHeader'
        - $ref: '#/components/parameters/BrandQuery'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountOrders'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '502':
          $ref: '#/components/responses/ConnectorError'
        '503':
          $ref: '#/components/responses/UpstreamAuthUnavailable'

  /workorders/tasks:
    get:
      tags: [Tareas y Visitas]
      summary: Tareas y notas de una orden de trabajo
      description: >
        Notas de cierre de una orden concreta (campos 15 y 16), desde FSM
        `POST /workorder/tasks`. **1 llamada upstream**, disparada al expandir
        una visita.


        ⚠ `workOrder` va por **query, no por path**: el valor es
        `ORDER/424900/2026` y las barras rompen el ruteo aunque se codifiquen
        como `%2F` (Fastify y varios proxies las normalizan).
      operationId: getWorkOrderTasks
      parameters:
        - name: workOrder
          in: query
          required: true
          description: Número de orden, tal cual lo devuelve `/account/process`.
          schema:
            type: string
            minLength: 1
            maxLength: 120
            example: ORDER/424900/2026
        - $ref: '#/components/parameters/BrandHeader'
        - $ref: '#/components/parameters/BrandQuery'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkOrderTasks'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '502':
          $ref: '#/components/responses/ConnectorError'
        '503':
          $ref: '#/components/responses/UpstreamAuthUnavailable'

  # ====================================================================
  # INTEGRACIONES (FSM)
  # ====================================================================

  /integrations/fsm/health:
    get:
      tags: [Integraciones]
      summary: Estado de la integración con FSM
      description: >
        Qué marcas tienen acceso configurado, de qué tipo, cuándo vence su token
        y cuánto le queda. **CERO llamadas a la operadora**: el estado se calcula
        decodificando el `exp` del JWT. Es lo que permite a la UI pintar el
        banner correcto sin gastar una consulta a producción.


        Nunca falla con 5xx por culpa de FSM: si no hay nada configurado,
        responde 200 con todas las marcas en `available:false`.
        El header `X-Wifix-Brand` se ignora: informa de todas las marcas.
      operationId: getFsmHealth
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FsmHealth'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /accounts/status-batch:
    post:
      tags: [Integraciones]
      summary: Estado de varias cuentas en lote (campo 8, paso 2)
      description: >
        Resuelve el estado A/S/T/O/P de hasta `FSM_STATUS_BATCH_LIMIT` (12)
        cuentas: es el paso 2 del campo 8, el que llena los `clientStatus` de
        `GET /naps/{napRef}/ports`. Internamente hace una llamada a
        `POST /account/status` por cuenta única, con concurrencia 4 y cache de
        5 minutos.


        **Se dispara SOLO por acción explícita del técnico** ("Consultar estado
        de N clientes"), nunca de forma automática ni en segundo plano: cada
        consulta golpea producción (ADR-05).


        Un fallo aislado no tumba el lote: esa cuenta vuelve con `status: null`
        y su `error`. Un fallo de token sí es global (503).
      operationId: postAccountsStatusBatch
      parameters:
        - $ref: '#/components/parameters/BrandHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StatusBatchRequest'
      responses:
        '200':
          description: OK. Siempre 200 si la petición fue válida, aunque algunas cuentas fallen.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusBatchResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '502':
          $ref: '#/components/responses/ConnectorError'
        '503':
          $ref: '#/components/responses/UpstreamAuthUnavailable'

# ======================================================================
# COMPONENTES
# ======================================================================

components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT emitido por POST /auth/login.

  # --------------------------------------------------------------------
  # PARÁMETROS REUTILIZABLES
  # --------------------------------------------------------------------
  parameters:
    ResourceId:
      name: id
      in: path
      required: true
      description: Identificador del recurso.
      schema:
        type: string
        format: uuid
    AccountNumberPath:
      name: accountNumber
      in: path
      required: true
      description: Número de cuenta del cliente.
      schema:
        type: string
    TerminalIdPath:
      name: id
      in: path
      required: true
      description: >
        Serial GPON (fibra) o MAC del cablemódem (HFC). Las MAC se aceptan
        con o sin separadores; el backend las normaliza a hexadecimal plano
        en mayúsculas porque IIS rechaza los ":" en la ruta.
      schema:
        type: string
        example: ZTEGC1234567
    BrandHeader:
      name: X-Wifix-Brand
      in: header
      required: false
      description: >
        Marca comercial (realm de FSM) con la que se consulta la operadora.
        Si falta, el backend usa `FSM_DEFAULT_BRAND`. Internamente nunca se
        habla de "realm": los nombres `realm-ecommerce-callcenter-*` quedan
        encerrados en el backend y el técnico no los ve (ADR-01).
      schema:
        type: string
        enum: [telenews, seteinfo]
        example: telenews
    BrandQuery:
      name: brand
      in: query
      required: false
      description: >
        Override de `X-Wifix-Brand` por query. Pensado para el script de sondeo
        y soporte; la webapp usa el header.
      schema:
        type: string
        enum: [telenews, seteinfo]
    AccountNumberFilter:
      name: accountNumber
      in: query
      description: Filtrar por número de cuenta del cliente (clave de Fase 1).
      schema:
        type: string
    ClientIdFilter:
      name: clientId
      in: query
      description: Filtrar por cliente (referencia upstream, opcional).
      schema:
        type: string
    ContractIdFilter:
      name: contractId
      in: query
      description: Filtrar por contrato (referencia upstream, opcional).
      schema:
        type: string
    VisitIdFilter:
      name: visitId
      in: query
      description: Filtrar por visita u orden de trabajo (referencia upstream, opcional).
      schema:
        type: string
    TechnicianIdFilter:
      name: technicianId
      in: query
      description: Filtrar por técnico (referencia upstream, opcional).
      schema:
        type: string
    TaskIdFilter:
      name: taskId
      in: query
      description: Filtrar por visita FSM (`TASK/…` u `ORDER/…`), coincidencia exacta.
      schema:
        type: string
    DateFrom:
      name: dateFrom
      in: query
      description: Fecha-hora inicial del rango (ISO 8601).
      schema:
        type: string
        format: date-time
    DateTo:
      name: dateTo
      in: query
      description: Fecha-hora final del rango (ISO 8601).
      schema:
        type: string
        format: date-time
    Page:
      name: page
      in: query
      description: Número de página (inicia en 1).
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      description: Cantidad de elementos por página.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

    TechnologyHintQuery:
      name: technology
      in: query
      required: false
      description: >
        Pista de tecnología (la app la conoce por el modelo del equipo). Solo se
        usa si la ficha de ISP Monitor no trae `type` explícito. Acepta
        sinónimos: ONT/ONU/XPON/FIBRA/FTTH → GPON; CABLEMODEM/CM/DOCSIS → HFC.
        Otro valor → 400.
      schema:
        type: string
        example: GPON

  # --------------------------------------------------------------------
  # RESPUESTAS REUTILIZABLES
  # --------------------------------------------------------------------
  responses:
    BadRequest:
      description: Solicitud inválida.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Token ausente, inválido o expirado / credenciales incorrectas.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Recurso no encontrado.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ConnectorError:
      description: >
        Un sistema externo falló (5xx, timeout o JSON inválido). No es un
        problema de credenciales.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    UpstreamAuthUnavailable:
      description: >
        El acceso a FSM no está disponible: token ausente, vencido o rechazado.


        **Es 503 a propósito, nunca 401.** La webapp cierra la sesión del
        técnico ante cualquier 401 (`api.js`), y un token caducado de un tercero
        no puede sacarlo al login en medio de una visita ni tumbarle Herramientas
        y Equipos Retirados, que no dependen de FSM.


        El cliente debe pintar un banner no bloqueante en el panel afectado y
        **no** cerrar sesión, no limpiar el token de Wifix y no recargar la app.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UpstreamAuthError'

  # --------------------------------------------------------------------
  # ESQUEMAS
  # --------------------------------------------------------------------
  schemas:

    # ---- Comunes -----------------------------------------------------

    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Código de error legible por máquina.
          example: VALIDATION_ERROR
        message:
          type: string
          description: Descripción del error legible por humanos.
          example: El campo accountNumber es obligatorio.
        details:
          type: array
          description: Detalle por campo, cuando aplica.
          items:
            type: object
            properties:
              field:
                type: string
              issue:
                type: string
        meta:
          type: object
          additionalProperties: true
          description: >
            Contexto adicional legible por máquina (integración, marca, motivo).
            Opcional y aditivo: el cliente nunca debe asumir que existe.

    UpstreamAuthError:
      type: object
      description: >
        Error de autenticación contra una API de terceros (hoy FSM). Siempre
        HTTP 503.
      required: [code, message]
      properties:
        code:
          type: string
          enum: [UPSTREAM_AUTH_ERROR]
        message:
          type: string
          description: Texto en español, listo para mostrar al técnico.
          example: >-
            El token de FSM (marca telenews) venció el 05/09/2026 21:59. Pide la
            renovación al contacto de la operadora.
        meta:
          type: object
          properties:
            integration:
              type: string
              example: FSM
            brand:
              type: string
              enum: [telenews, seteinfo]
            reason:
              type: string
              enum: [MISSING, EXPIRED, REJECTED]
              description: >
                `MISSING`: no hay acceso configurado en el servidor.
                `EXPIRED`: el token venció (detectado SIN salir a la red).
                `REJECTED`: la operadora lo rechazó (revocado o de otro realm).
            tokenExpiresAt:
              type: string
              format: date-time
              nullable: true
            retryable:
              type: boolean
              example: false

    Degraded:
      type: object
      description: >
        Aviso de que una respuesta 200 se sirvió con una fuente alternativa o
        incompleta. **No es un error.** Ausente cuando todo salió bien; el
        cliente nunca debe asumir que existe.
      required: [reason, message]
      properties:
        reason:
          type: string
          enum: [FSM_AUTH, FSM_UNAVAILABLE, FSM_NO_DATA, SOURCE_FALLBACK, TRUNCATED]
          description: >
            `FSM_NO_DATA` (client-profile con FSM real): FSM no trajo identidad
            para la cuenta; los campos de identidad van `null` (`sources`
            `NONE`) o, el nombre, desde la whitelist (`WHITELIST`).
        message:
          type: string
          description: Texto en español, listo para mostrar.

    PageInfo:
      type: object
      properties:
        page:
          type: integer
          example: 1
        pageSize:
          type: integer
          example: 20
        totalItems:
          type: integer
          example: 137
        totalPages:
          type: integer
          example: 7

    PagedResponse:
      type: object
      properties:
        page:
          $ref: '#/components/schemas/PageInfo'
        data:
          type: array
          items: {}

    GeoPoint:
      type: object
      description: Coordenada geográfica.
      required: [latitude, longitude]
      properties:
        latitude:
          type: number
          format: double
          example: -0.180653
        longitude:
          type: number
          format: double
          example: -78.467834

    ServiceContext:
      type: object
      description: >
        Referencias del registro hacia el cliente y la orden de trabajo.
        En la Fase 1 la clave práctica es `accountNumber`. Los demás
        identificadores son opcionales: provendrán de un sistema upstream
        por definir y en Fase 1 se completan con valores de prueba.
      required: [accountNumber]
      properties:
        accountNumber:
          type: string
          description: >
            Número de cuenta del cliente ingresado por el técnico. Clave
            práctica de la Fase 1.
          example: WX-548210
        clientId:
          type: string
          description: >
            Identificador del cliente. Opcional. Referencia upstream por
            definir; en Fase 1 es un valor de prueba.
        contractId:
          type: string
          description: >
            Identificador del contrato. Opcional. En una fase posterior
            será reemplazado por `taskId`.
        visitId:
          type: string
          description: >
            Identificador de la visita u orden de trabajo. Opcional.
            Referencia upstream por definir; en Fase 1 es un valor de prueba.
        technicianId:
          type: string
          description: >
            Identificador del técnico. Opcional. No hay autenticación en
            la Fase 1.
        taskId:
          type: string
          maxLength: 120
          description: >
            Visita FSM en la que se tomó el registro: tarea (`TASK/294328/2026`)
            u orden (`ORDER/424900/2026`). Opcional pero **recomendado**: es lo
            que asocia el registro a la visita en
            `GET /accounts/{accountNumber}/visits?include=records`. Sin él la
            asociación es por ventana de tiempo.
          example: ORDER/424900/2026

    # ---- Catálogos ---------------------------------------------------

    SpeedtestServer:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
          example: Servidor Quito
        host:
          type: string
          example: quito.speedtest.example.com
        city:
          type: string
          example: Quito
        location:
          $ref: '#/components/schemas/GeoPoint'
        active:
          type: boolean
          default: true

    NetworkServer:
      type: object
      description: Servidor común sugerido para pruebas de ping y traceroute.
      properties:
        id:
          type: string
        name:
          type: string
          example: Google DNS
        target:
          type: string
          description: IP o URL del servidor.
          example: 8.8.8.8
        type:
          type: string
          enum: [DNS, GATEWAY, CDN, GENERIC]
        active:
          type: boolean
          default: true

    EquipmentSerialFieldType:
      type: string
      description: >
        Campo del código de barras que debe leerse como número de serie
        según el modelo de equipo.
      enum: [SN, HOST-SN, PON-SN, GPON-SN, D-SN]

    EquipmentCategory:
      type: string
      enum: [DECODIFICADOR, DECODIFICADOR_HD, MTA, ONU, ONT, ROUTER]

    EquipmentModel:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
          example: ONT Huawei OptiXstar
        category:
          $ref: '#/components/schemas/EquipmentCategory'
        serialFieldType:
          $ref: '#/components/schemas/EquipmentSerialFieldType'
        brand:
          type: string
          example: Huawei
        active:
          type: boolean
          default: true

    RemovalReasonCode:
      type: string
      description: Código del motivo de retiro de un equipo.
      enum:
        - DANO_FISICO
        - NO_ENCIENDE
        - PUERTO_DANADO
        - EQUIPO_INHIBIDO
        - NO_DA_SERVICIO
        - NO_SE_APROVISIONA
        - EQUIPO_OK_CANCELACION
        - OTROS

    RemovalReason:
      type: object
      properties:
        code:
          $ref: '#/components/schemas/RemovalReasonCode'
        label:
          type: string
          example: Puerto LAN o RF dañado (no da conectividad)
        active:
          type: boolean
          default: true

    MediaFile:
      type: object
      properties:
        id:
          type: string
          format: uuid
        url:
          type: string
          format: uri
        contentType:
          type: string
          example: image/jpeg
        sizeBytes:
          type: integer
        createdAt:
          type: string
          format: date-time

    # ---- Medición de distancia (campo 22) ----------------------------

    DistanceMeasurementInput:
      allOf:
        - $ref: '#/components/schemas/ServiceContext'
        - type: object
          required: [distanceMeters, measuredAt]
          properties:
            distanceMeters:
              type: number
              format: double
              description: Distancia recorrida del punto A al punto B, en metros.
              example: 142.7
            startPoint:
              $ref: '#/components/schemas/GeoPoint'
            endPoint:
              $ref: '#/components/schemas/GeoPoint'
            measuredAt:
              type: string
              format: date-time
            notes:
              type: string

    DistanceMeasurement:
      allOf:
        - type: object
          properties:
            id:
              type: string
              format: uuid
            createdAt:
              type: string
              format: date-time
        - $ref: '#/components/schemas/DistanceMeasurementInput'

    # ---- Test de velocidad (campo 23) --------------------------------

    SpeedtestInput:
      description: >
        Speedtest de la app (`source: app`, default) o de un **dispositivo
        Android externo** del técnico con puerto de hasta 10 Gb/s
        (`source: external-device`). Para el externo son obligatorios
        `deviceName` o `deviceId`, y `downloadMbps`/`uploadMbps` ≤ 10000.
        `measuredAt` es obligatorio; `timestamp` se acepta como alias.
      allOf:
        - $ref: '#/components/schemas/ServiceContext'
        - type: object
          required: [downloadMbps, uploadMbps, measuredAt]
          properties:
            source:
              type: string
              enum: [app, external-device]
              default: app
            deviceName:
              type: string
              maxLength: 120
              example: Tester 10G #1
            deviceId:
              type: string
              maxLength: 120
              example: AND-10G-0001
            simulated:
              type: boolean
              default: false
              description: true si el resultado es simulado (hoy el externo se simula desde el frontend).
            timestamp:
              type: string
              format: date-time
              description: Alias de `measuredAt` (entrada). La respuesta siempre trae `measuredAt`.
            downloadMbps:
              type: number
              format: double
              example: 185.4
            uploadMbps:
              type: number
              format: double
              example: 92.1
            latencyMs:
              type: number
              format: double
              example: 11.3
            jitterMs:
              type: number
              format: double
              example: 1.8
            packetLossPercent:
              type: number
              format: double
              example: 0
            serverId:
              type: string
            serverName:
              type: string
            ispName:
              type: string
            measuredAt:
              type: string
              format: date-time
            notes:
              type: string

    Speedtest:
      allOf:
        - type: object
          properties:
            id:
              type: string
              format: uuid
            createdAt:
              type: string
              format: date-time
        - $ref: '#/components/schemas/SpeedtestInput'

    # ---- Mapa de calor WiFi (campo 24) -------------------------------

    HeatmapRoomInput:
      type: object
      required: [roomName, measurements, measuredAt]
      properties:
        roomName:
          type: string
          example: Dormitorio principal
        floor:
          type: integer
          description: Piso de la habitación. Usar 1 si la vivienda tiene un solo piso.
          default: 1
          example: 2
        measurements:
          type: array
          minItems: 1
          description: >
            Lecturas de señal en este punto, una entrada por AP detectado en el
            scan WiFi. Reemplaza el campo `signalDbm` legacy. Al menos una
            entrada (típicamente la del AP conectado, marcada con
            isConnected=true) debe estar presente.
          items:
            $ref: '#/components/schemas/RoomApMeasurement'
        signalDbm:
          type: number
          format: double
          deprecated: true
          description: >
            DEPRECATED. Reemplazado por `measurements[]`. Sólo presente en
            relevamientos en formato anterior (`legacyFormat: true` en la
            respuesta) o en clientes que aún no soportan multi-AP.
          example: -58
        measuredAt:
          type: string
          format: date-time
        notes:
          type: string

    HeatmapRoom:
      allOf:
        - type: object
          properties:
            id:
              type: string
              format: uuid
            legacyFormat:
              type: boolean
              default: false
              description: >
                True si esta habitación proviene del modelo viejo (un único
                `signalDbm` por habitación) y fue migrada con una entrada
                sintética en `measurements`. El frontend puede usar este flag
                para mostrar un aviso y desactivar la vista "Por equipo".
        - $ref: '#/components/schemas/HeatmapRoomInput'

    WifiHeatmapInput:
      allOf:
        - $ref: '#/components/schemas/ServiceContext'
        - type: object
          required: [rooms]
          properties:
            label:
              type: string
            rooms:
              type: array
              minItems: 1
              items:
                $ref: '#/components/schemas/HeatmapRoomInput'
            notes:
              type: string

    WifiHeatmap:
      allOf:
        - type: object
          properties:
            id:
              type: string
              format: uuid
            createdAt:
              type: string
              format: date-time
        - $ref: '#/components/schemas/ServiceContext'
        - type: object
          properties:
            label:
              type: string
            rooms:
              type: array
              items:
                $ref: '#/components/schemas/HeatmapRoom'
            notes:
              type: string

    # ---- Access Points WiFi detectados (auxiliar del campo 24) -------

    RoomApMeasurement:
      type: object
      required: [bssid, signalDbm]
      description: >
        Lectura de señal hacia un AP específico desde un punto de medición
        (una habitación). Permite reconstruir la cobertura por equipo.
      properties:
        bssid:
          type: string
          description: MAC del radio del AP (formato `xx:xx:xx:xx:xx:xx`). Llave técnica para identificar la fuente.
          example: aa:bb:cc:dd:ee:ff
        accessPointId:
          type: string
          format: uuid
          description: Referencia al `WifiAccessPoint` cuando ya fue registrado en la visita. Opcional para soportar scans con APs aún no etiquetados.
        apLabelSnapshot:
          type: string
          description: >
            Nombre amigable del AP al momento de la medición. Histórico —
            no se actualiza si el AP se renombra después. Útil para mostrar
            heatmaps viejos coherentes.
          example: Router principal
        signalDbm:
          type: number
          format: double
          description: Potencia recibida del AP en dBm. Negativo, más cercano a 0 = mejor.
          example: -58
        band:
          type: string
          enum: ["2.4GHz", "5GHz", "6GHz", "unknown"]
          default: unknown
        channel:
          type: integer
          description: Canal WiFi (1-13 en 2.4 GHz, 36-165 en 5 GHz, etc.).
          example: 36
        isConnected:
          type: boolean
          default: false
          description: True si el celular del técnico estaba asociado a este BSSID al momento del scan.

    WifiAccessPointInput:
      type: object
      required: [bssid, label]
      properties:
        bssid:
          type: string
          description: MAC del radio del AP (formato `xx:xx:xx:xx:xx:xx`). Único por equipo y banda.
          example: aa:bb:cc:dd:ee:ff
        ssid:
          type: string
          description: Nombre de red detectado durante el scan.
          example: Casa_Perez
        label:
          type: string
          description: Nombre amigable puesto por el técnico (visible en la UI).
          example: Router principal
        apType:
          type: string
          enum: [router, extender, mesh_node, unknown]
          default: unknown
          description: Tipo de equipo. Puede dejarse "unknown" si el técnico no está seguro.
        band:
          type: string
          enum: ["2.4GHz", "5GHz", "6GHz", "unknown"]
          default: unknown
          description: Banda principal de operación detectada para este BSSID. Un router dual-band típicamente tiene dos BSSIDs (uno por banda).
        notes:
          type: string

    WifiAccessPoint:
      allOf:
        - type: object
          properties:
            id:
              type: string
              format: uuid
            accountNumber:
              type: string
              description: Cuenta del cliente a la que pertenece este equipo. Permite reusar los labels entre visitas de la misma cuenta.
              example: WX-100123
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time
        - $ref: '#/components/schemas/WifiAccessPointInput'

    WifiAccessPointUpdate:
      type: object
      description: Campos editables de un `WifiAccessPoint`. Todos opcionales.
      properties:
        label:
          type: string
        apType:
          type: string
          enum: [router, extender, mesh_node, unknown]
        band:
          type: string
          enum: ["2.4GHz", "5GHz", "6GHz", "unknown"]
        notes:
          type: string

    # ---- Ping (campo 25) ---------------------------------------------

    PingTestInput:
      allOf:
        - $ref: '#/components/schemas/ServiceContext'
        - type: object
          required: [target, measuredAt]
          properties:
            target:
              type: string
              description: IP o URL a la que se ejecutó el ping.
              example: 8.8.8.8
            serverId:
              type: string
            packetsSent:
              type: integer
              example: 10
            packetsReceived:
              type: integer
              example: 10
            packetLossPercent:
              type: number
              format: double
              example: 0
            minLatencyMs:
              type: number
              format: double
            avgLatencyMs:
              type: number
              format: double
            maxLatencyMs:
              type: number
              format: double
            continuous:
              type: boolean
              default: false
            heatmapId:
              type: string
              format: uuid
              description: Mapa de calor al que se asocia este ping, si aplica.
            roomName:
              type: string
            measuredAt:
              type: string
              format: date-time
            notes:
              type: string

    PingTest:
      allOf:
        - type: object
          properties:
            id:
              type: string
              format: uuid
            createdAt:
              type: string
              format: date-time
        - $ref: '#/components/schemas/PingTestInput'

    # ---- Traceroute (campo 26) ---------------------------------------

    TracerouteHop:
      type: object
      required: [hopNumber]
      properties:
        hopNumber:
          type: integer
          example: 3
        host:
          type: string
          description: Host o IP del salto. Nulo si el salto no respondió.
          example: 10.0.0.1
        latencyMs:
          type: number
          format: double

    TracerouteTestInput:
      allOf:
        - $ref: '#/components/schemas/ServiceContext'
        - type: object
          required: [target, hops, measuredAt]
          properties:
            target:
              type: string
              example: www.example.com
            serverId:
              type: string
            hops:
              type: array
              items:
                $ref: '#/components/schemas/TracerouteHop'
            measuredAt:
              type: string
              format: date-time
            notes:
              type: string

    TracerouteTest:
      allOf:
        - type: object
          properties:
            id:
              type: string
              format: uuid
            createdAt:
              type: string
              format: date-time
        - $ref: '#/components/schemas/TracerouteTestInput'

    # ---- Equipos retirados (campo 27) --------------------------------

    RetiredEquipmentInput:
      allOf:
        - $ref: '#/components/schemas/ServiceContext'
        - type: object
          required:
            - equipmentModelId
            - serialValue
            - removalReasonCode
            - retiredAt
          properties:
            equipmentModelId:
              type: string
              description: Modelo del equipo retirado (ver catálogo de modelos).
            serialValue:
              type: string
              description: Número de serie ya decodificado por la app.
              example: 48575443A1B2C3D4
            barcodePhotoId:
              type: string
              format: uuid
              description: Identificador de la foto del código de barras (ver POST /media).
            removalReasonCode:
              $ref: '#/components/schemas/RemovalReasonCode'
            observations:
              type: string
            retiredAt:
              type: string
              format: date-time

    RetiredEquipment:
      allOf:
        - type: object
          properties:
            id:
              type: string
              format: uuid
            createdAt:
              type: string
              format: date-time
        - $ref: '#/components/schemas/RetiredEquipmentInput'
        - type: object
          properties:
            serialFieldType:
              $ref: '#/components/schemas/EquipmentSerialFieldType'
            barcodePhotoUrl:
              type: string
              format: uri
              description: URL de la foto, resuelta desde barcodePhotoId.

    # ---- Historial de la cuenta --------------------------------------

    AccountToolHistory:
      type: object
      properties:
        accountNumber:
          type: string
        distanceMeasurements:
          type: array
          items:
            $ref: '#/components/schemas/DistanceMeasurement'
        speedtests:
          type: array
          items:
            $ref: '#/components/schemas/Speedtest'
        wifiHeatmaps:
          type: array
          items:
            $ref: '#/components/schemas/WifiHeatmap'
        pingTests:
          type: array
          items:
            $ref: '#/components/schemas/PingTest'
        tracerouteTests:
          type: array
          items:
            $ref: '#/components/schemas/TracerouteTest'
        retiredEquipment:
          type: array
          items:
            $ref: '#/components/schemas/RetiredEquipment'

    # ---- Autenticación -----------------------------------------------

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: franco@tulpasolutions.com
        password:
          type: string
          format: password

    LoginResponse:
      type: object
      properties:
        token:
          type: string
          description: JWT para el header Authorization Bearer.
        user:
          $ref: '#/components/schemas/User'

    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        name:
          type: string
        active:
          type: boolean

    # ---- Datos del cliente (campos 1-5, 7) ---------------------------

    ClientProfile:
      type: object
      properties:
        accountNumber:
          type: string
        fullName:
          type: string
          nullable: true
          description: >
            Nombres y apellidos (campo 1). Con FSM `real` puede venir de la
            whitelist de clientes (`sources.fullName: WHITELIST`) o ser `null`
            (`NONE`) si ni FSM ni la whitelist lo tienen. En `mock`/`fixture`
            nunca es null.
        address:
          type: string
          nullable: true
          description: Dirección (campo 2). `null` con FSM `real` sin dato (`NONE`).
        phones:
          type: array
          nullable: true
          description: >
            Teléfonos (campo 3). `null` con FSM `real` sin dato (`NONE`); en
            `mock`/`fixture` siempre es un array.
          items:
            type: string
        planName:
          type: string
        contractedDownloadMbps:
          type: number
          format: double
          description: Velocidad de descarga contratada (campo 5).
        contractedUploadMbps:
          type: number
          format: double
          description: >-
            Velocidad de subida contratada (campo 5). Los planes son simétricos:
            hoy (simulado) siempre igual a `contractedDownloadMbps`.
        email:
          type: string
          nullable: true
          description: Correo del cliente según FSM. Puede ser null.
        latitude:
          type: number
          format: double
          nullable: true
          description: >
            Coordenada del domicilio según la orden más reciente. Es la entrada
            del campo 6: evita que el técnico tenga que capturar GPS cuando la
            orden ya trae la coordenada.
        longitude:
          type: number
          format: double
          nullable: true
        sources:
          type: object
          description: >
            De dónde salió cada campo. `FSM` = dato real de la operadora,
            `MOCK` = simulado (o editado a mano con el PUT), `COMARCH` = TYTAN,
            `WHITELIST` = base de clientes Xtrim importada (solo `fullName`,
            con FSM `real` sin nombre), `NONE` = sin dato: el campo va `null`
            (solo con FSM `real`, que nunca inventa identidad). La UI marca
            visualmente lo que no es `FSM`. Aditivo: quien lo ignore sigue
            funcionando.
          additionalProperties:
            type: string
            enum: [FSM, MOCK, COMARCH, WHITELIST, NONE]
          example:
            fullName: FSM
            address: FSM
            phones: FSM
            email: FSM
            latitude: FSM
            longitude: FSM
            planName: MOCK
            contractedDownloadMbps: MOCK
            contractedUploadMbps: MOCK
        degraded:
          $ref: '#/components/schemas/Degraded'

    ClientProfileUpdate:
      type: object
      description: Campos editables del módulo de actualización de datos (campo 4).
      properties:
        fullName:
          type: string
        address:
          type: string
        phones:
          type: array
          items:
            type: string

    AccountStatus:
      type: string
      description: >
        Estado de la cuenta en el modelo interno. FSM publica cinco códigos
        (A/S/T/O/P); todo lo demás cae en DESCONOCIDA.
      enum: [ACTIVA, SUSPENDIDA, TERMINADA, ORDENADA, PENDIENTE, DESCONOCIDA]

    AccountStatusCode:
      type: string
      nullable: true
      description: >
        Código crudo de la operadora: A (activo), S (suspendido), T (terminado),
        O (ordenado), P (pendiente). `null` si no vino o no se reconoció.
      enum: [A, S, T, O, P, null]

    ContractStatus:
      type: object
      description: >
        FSM no devuelve "otras cuentas del mismo contrato": `accounts` trae
        exactamente un elemento hasta que exista ese endpoint.
      properties:
        clientName:
          type: string
          description: >
            Nombre del cliente según la orden más reciente de FSM. Con FSM
            `real`, si FSM no lo trae se usa el de la whitelist de clientes
            Xtrim (mismo respaldo que client-profile). `""` si no hay ninguno
            (nunca el nombre simulado del mock).
        clientNameSource:
          type: string
          enum: [FSM, WHITELIST, NONE]
          description: >
            De dónde salió `clientName`. `WHITELIST` solo con FSM `real`;
            `NONE` ⇔ `clientName` es `""`.
        accounts:
          type: array
          items:
            type: object
            properties:
              accountNumber:
                type: string
              contractId:
                type: string
                nullable: true
                description: >
                  ⚠ Ahora puede ser `null`: FSM no expone contrato, solo órdenes
                  de trabajo.
              status:
                $ref: '#/components/schemas/AccountStatus'
              statusCode:
                $ref: '#/components/schemas/AccountStatusCode'
              statusDescription:
                type: string
                nullable: true
                description: Texto literal de la operadora ("Activo", "Suspendido"…).
              lastWorkOrder:
                type: string
                nullable: true
                description: Orden de trabajo más reciente de `/account/process`.
                example: ORDER/424900/2026
        brand:
          type: string
          enum: [telenews, seteinfo]
          description: Marca efectivamente usada en la consulta.

    # ---- Diagnóstico de red (campos 6, 8-14, 19-21) ------------------

    NearbyNap:
      type: object
      description: NAP cercana (campo 6). La fuente la indica `source`.
      properties:
        napId:
          type: integer
          nullable: true
          description: >
            Id numérico de la NAP en FSM. Es la entrada de
            `GET /naps/{napRef}/ports`. `null` cuando la fuente es TEC.
          example: 11547
        napCode:
          type: string
          example: PL2KD9
        networkName:
          type: string
          nullable: true
          description: >
            Red de acceso (OLT/puerto) de la que cuelga la NAP. Nunca se rotula
            como "nodo": la operadora confirmó que ese concepto no existe.
            `null` cuando la fuente es TEC.
          example: OLT-GYE-03/1/2
        latitude:
          type: number
          format: double
          nullable: true
          description: Coordenada de la NAP; null si la operadora no la devuelve.
        longitude:
          type: number
          format: double
          nullable: true
        distanceMeters:
          type: number
          format: double
          description: Distancia calculada por la operadora desde la coordenada consultada.
        occupiedPorts:
          type: integer
        totalPorts:
          type: integer
        freePorts:
          type: integer
          description: totalPorts - occupiedPorts, nunca negativo.
        source:
          type: string
          enum: [FSM, TEC, SIMULATED]
          description: >
            De dónde salió la fila (ver `NAPS_PRIMARY_SOURCE`, ADR-04).
            `SIMULATED` solo aparece en `current-nap` (NAP asignada simulada);
            `/naps/nearby` nunca lo devuelve.

    CurrentNap:
      type: object
      description: >
        NAP y puerto en los que está conectada la cuenta
        (`GET /accounts/{accountNumber}/current-nap`).
      required:
        [accountNumber, found, nap, portNumber, equipmentId, clientStatus, searchedNaps, brand]
      properties:
        accountNumber:
          type: string
          example: '35070291'
        found:
          type: boolean
        nap:
          allOf:
            - $ref: '#/components/schemas/NearbyNap'
          nullable: true
          description: >
            NAP donde apareció la cuenta (o la asignada simulada, con
            `source:SIMULATED` y `napId:null`); `null` si `found:false`.
        portNumber:
          type: integer
          nullable: true
          example: 7
        equipmentId:
          type: string
          nullable: true
          description: >
            Serial/ID GPON del equipo en ese puerto, si FSM lo trae. Siempre
            `null` con `simulated:true`.
          example: ZTEGD434832
        clientStatus:
          type: object
          nullable: true
          description: >
            Estado de la cuenta. `null` si no se encontró la NAP o si la
            consulta de estado falló (en ese caso viene `degraded`).
          required: [code, name, description]
          properties:
            code:
              $ref: '#/components/schemas/AccountStatusCode'
            name:
              $ref: '#/components/schemas/AccountStatus'
            description:
              type: string
              nullable: true
              description: Texto literal de la operadora ("Activo", "Suspendido"…).
        searchedNaps:
          type: integer
          minimum: 0
          maximum: 3
          description: NAPs cuyo `/naps/accounts` se consultó antes de cortar.
        reason:
          type: string
          enum: [NOT_FOUND, NO_COORDS, NOT_SUPPORTED]
          description: >
            Solo con `found:false`. `NOT_FOUND`: no está en las NAPs a ≤150 m.
            `NO_COORDS`: el cliente no tiene coordenada en FSM y no se envió
            override. `NOT_SUPPORTED`: la fuente de NAPs es TEC.
        brand:
          type: string
          enum: [telenews, seteinfo]
          description: Marca efectivamente usada en la consulta.
        degraded:
          $ref: '#/components/schemas/Degraded'
        source:
          type: string
          nullable: true
          enum: [FSM, SIMULATED]
          description: >
            `FSM` si la NAP es la real, `SIMULATED` si es la asignada simulada;
            `null` solo con `found:false` (`fallback=none`). Aditivo 2026-09-30.
        simulated:
          type: boolean
          description: '`true` solo cuando la NAP es simulada.'
        assignment:
          type: string
          nullable: true
          enum: [CONTRACTED]
          description: >
            La NAP es la contratada/asignada al cliente. `null` solo con
            `found:false` (`fallback=none`).
        simulationReason:
          type: string
          enum: [NOT_FOUND, NO_COORDS, NOT_SUPPORTED, UPSTREAM_AUTH_ERROR, UPSTREAM_UNAVAILABLE]
          description: Solo con `simulated:true`. Por qué no se usó la NAP real.

    RegisteredLocation:
      type: object
      description: >
        Ubicación registrada del cliente. Hoy sale solo de FSM
        `/account/process`; `MOCK` con el conector FSM en mock. `TEC` queda
        reservado: TEC no expone el domicilio.
      required: [latitude, longitude, source]
      properties:
        latitude: { type: number, format: double }
        longitude: { type: number, format: double }
        source:
          type: string
          enum: [FSM, TEC, MOCK]

    ClientLocationInput:
      type: object
      required: [latitude, longitude, source]
      properties:
        latitude: { type: number, format: double, minimum: -90, maximum: 90 }
        longitude:
          type: number
          format: double
          minimum: -180
          maximum: 180
          description: (0,0) es 400.
        accuracyMeters: { type: number, minimum: 0, description: Precisión del GPS en metros. }
        label:
          type: string
          enum: [CASA_CLIENTE]
          default: CASA_CLIENTE
        source:
          type: string
          enum: [GPS, MANUAL]
        napCode:
          type: string
          maxLength: 50
          description: NAP del cliente. Sin él, la de current-nap.
        napPort:
          oneOf:
            - { type: string, maxLength: 20 }
            - { type: integer, minimum: 0 }
          description: Puerto en la NAP. Sin él (y misma NAP), el de current-nap.
        taskId:
          type: string
          maxLength: 100
          description: '`workOrder` (ORDER/…) o tarea (TASK/…) de la visita en curso.'
        capturedAt:
          type: string
          format: date-time
          description: Default ahora. No puede ser futura.
        notes: { type: string, maxLength: 500 }

    ClientLocation:
      type: object
      required:
        - id
        - accountNumber
        - label
        - latitude
        - longitude
        - accuracyMeters
        - source
        - napCode
        - napPort
        - taskId
        - capturedAt
        - createdAt
        - capturedBy
        - registeredLocation
        - distanceToRegisteredMeters
        - distanceToNapMeters
      properties:
        id: { type: string, format: uuid }
        accountNumber: { type: string, description: Normalizada. }
        label: { type: string, enum: [CASA_CLIENTE] }
        latitude: { type: number, format: double }
        longitude: { type: number, format: double }
        accuracyMeters: { type: number, nullable: true }
        source: { type: string, enum: [GPS, MANUAL] }
        napCode: { type: string, nullable: true }
        napPort:
          oneOf:
            - { type: integer, nullable: true }
            - { type: string, nullable: true }
          description: Número si el puerto es numérico; texto tal cual si no.
        taskId: { type: string, nullable: true }
        capturedAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        capturedBy:
          type: object
          required: [id, email]
          properties:
            id: { type: string }
            email: { type: string }
        registeredLocation:
          type: object
          allOf:
            - $ref: '#/components/schemas/RegisteredLocation'
          nullable: true
          description: Foto de la ubicación registrada al capturar.
        distanceToRegisteredMeters:
          type: number
          nullable: true
          description: Haversine captura ↔ registrada (m).
        distanceToNapMeters:
          type: number
          nullable: true
          description: Haversine captura ↔ NAP del cliente (m). null si no se conocen sus coordenadas.
        napLocation:
          type: object
          nullable: true
          description: >
            Aditivo. Coordenada de la NAP usada para `distanceToNapMeters`;
            `simulated:true` si era la NAP asignada simulada.
          properties:
            latitude: { type: number, format: double }
            longitude: { type: number, format: double }
            simulated: { type: boolean }
        notes: { type: string, nullable: true, description: Aditivo. }

    AccountClientLocations:
      type: object
      required: [latest, items, registeredLocation]
      properties:
        latest:
          type: object
          allOf:
            - $ref: '#/components/schemas/ClientLocation'
          nullable: true
        items:
          type: array
          maxItems: 50
          items: { $ref: '#/components/schemas/ClientLocation' }
        registeredLocation:
          type: object
          allOf:
            - $ref: '#/components/schemas/RegisteredLocation'
          nullable: true

    ClientLocationPage:
      type: object
      required: [items, page]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ClientLocation' }
        page:
          type: object
          properties:
            page: { type: integer }
            pageSize: { type: integer }
            totalItems: { type: integer }
            totalPages: { type: integer }

    DeviceCatalogItem:
      type: object
      required:
        [model, displayName, brand, deviceType, category, wifiTech, ethernetMaxMbps, wifiMaxMbps, wifiStatus, serialPrefixes]
      properties:
        model: { type: string, description: Clave del catálogo (columna MODELO). Es lo que se envía en el POST. }
        displayName: { type: string }
        brand: { type: string }
        deviceType: { type: string, description: 'ONT | ROUTER | REPETIDOR POWERLINE' }
        category: { type: string, example: ONT / ONU (GPON) }
        wifiTech: { type: string, nullable: true, example: WIFI 6 }
        ethernetMaxMbps: { type: integer, minimum: 1 }
        wifiMaxMbps:
          type: integer
          nullable: true
          description: null sin WiFi. Con `wifiStatus=disabled` es solo informativo.
        wifiStatus:
          type: string
          enum: [enabled, none, disabled]
          description: '`none` = sin radio WiFi; `disabled` = radio desactivado (ZXHN F660). En ambos solo cuenta Ethernet.'
        serialPrefixes:
          type: array
          items: { type: string }
          description: Pista de marca por prefijo de serial (ZTEG, ZTEL, HWTC, BWH, STGU, XPON). No identifica el modelo exacto.

    DeviceCatalog:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/DeviceCatalogItem' }

    DeviceValidationInput:
      type: object
      required: [serial, model, category]
      description: '`planMbps` NO se acepta: lo resuelve el servidor (un campo extra se ignora).'
      properties:
        serial: { type: string, minLength: 1, maxLength: 64 }
        model:
          type: string
          minLength: 1
          maxLength: 120
          description: '`model` (o `displayName`) del catálogo. Sin distinguir mayúsculas/espacios.'
        category: { type: string, enum: [instalaciones, migraciones, visitas] }
        taskId:
          type: string
          maxLength: 120
          description: '`workOrder` (ORDER/…) o tarea (TASK/…) de la visita en curso.'
        serialSource: { type: string, enum: [barcode, ocr, manual] }

    DeviceValidationReason:
      type: object
      required: [kind]
      properties:
        kind: { type: string, enum: [ethernet, wifi, not_in_catalog] }
        deviceMbps: { type: integer, description: Solo en ethernet / wifi. }
        planMbps: { type: integer, description: En ethernet / wifi; en not_in_catalog solo si se conoce el plan. }

    DeviceValidation:
      type: object
      required:
        - id
        - accountNumber
        - category
        - taskId
        - serial
        - serialSource
        - model
        - result
        - planMbps
        - planSource
        - device
        - reasons
        - message
        - createdAt
        - technician
      properties:
        id: { type: string, format: uuid }
        accountNumber: { type: string, description: Normalizada. }
        category: { type: string, enum: [instalaciones, migraciones, visitas] }
        taskId: { type: string, nullable: true }
        serial: { type: string }
        serialSource: { type: string, nullable: true, enum: [barcode, ocr, manual] }
        model: { type: string, description: Modelo tal como lo envió la app. }
        result:
          type: string
          enum: [ok, blocked, unknown_plan]
          description: '`blocked` = alerta; la app no deja continuar con ese equipo.'
        planMbps: { type: integer, nullable: true, description: Velocidad de bajada contratada. null → unknown_plan. }
        planSource: { type: string, enum: [simulated, real] }
        device:
          type: object
          allOf:
            - $ref: '#/components/schemas/DeviceCatalogItem'
          nullable: true
          description: Foto del ítem del catálogo al validar; null si no está homologado.
        reasons:
          type: array
          items: { $ref: '#/components/schemas/DeviceValidationReason' }
        message: { type: string, description: Texto en español para mostrar al técnico. }
        createdAt: { type: string, format: date-time }
        technician:
          type: object
          required: [id, email, name]
          description: Técnico del JWT que hizo la validación.
          properties:
            id: { type: string }
            email: { type: string }
            name: { type: string, nullable: true }

    AccountDeviceValidations:
      type: object
      required: [items]
      properties:
        items:
          type: array
          maxItems: 50
          items: { $ref: '#/components/schemas/DeviceValidation' }

    DeviceValidationPage:
      type: object
      required: [items, page]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/DeviceValidation' }
        page:
          type: object
          properties:
            page: { type: integer }
            pageSize: { type: integer }
            totalItems: { type: integer }
            totalPages: { type: integer }

    WhitelistCheck:
      type: object
      description: >
        Resultado de `GET /accounts/{accountNumber}/whitelist`. Tres formas
        según `listed`: `true` (con `source`, `status` y datos de la lista),
        `false` (solo `importedAt` y `enforce`) y `null` (lista vacía, con
        `reason`). Nunca incluye la cédula/RUC.
      required: [accountNumber, listed, importedAt, enforce]
      properties:
        accountNumber:
          type: string
          description: Número de cuenta normalizado.
          example: '35070291'
        listed:
          type: boolean
          nullable: true
          description: >
            `true` listada, `false` no listada, `null` no hay lista importada.
        source:
          type: string
          enum: [IMPORT, EXTRA]
          description: >
            Solo con `listed:true`. `IMPORT`: lista importada. `EXTRA`:
            `WHITELIST_EXTRA_ACCOUNTS` (cuentas demo).
        status:
          type: string
          enum: [ACTIVO, SUSPENDIDO, ORDENADO, PENDIENTE]
          description: >
            Solo con `listed:true`. Con varios productos, el de mayor
            prioridad (ACTIVO > SUSPENDIDO > ORDENADO > PENDIENTE). `EXTRA`
            siempre es `ACTIVO`.
        city:
          type: string
          nullable: true
          description: Solo con `listed:true` (CIUDAD_MATRICES). `null` en `EXTRA`.
          example: GUAYAQUIL
        node:
          type: string
          nullable: true
          description: Solo con `listed:true` (NODO). `null` en `EXTRA`.
          example: AR7S
        businessType:
          type: string
          nullable: true
          description: Solo con `listed:true` (TIPO_DE_NEGOCIO).
          example: Internet CM
        accountType:
          type: string
          nullable: true
          description: >
            Solo con `listed:true` (TIPO_CUENTA del producto). `null` si la
            cuenta no tiene productos en la planilla o es `EXTRA`.
          example: Residencial
        accessType:
          type: string
          nullable: true
          description: >
            Solo con `listed:true` (TIPO_ACCESO del producto de mayor
            prioridad). `null` si no hay productos o es `EXTRA`.
          example: Acceso Completo
        importedAt:
          type: string
          format: date-time
          nullable: true
          description: Fecha del último import; `null` si nunca se importó.
        enforce:
          type: boolean
          description: >
            `WHITELIST_ENFORCE`. `true`: la app bloquea `listed:false`. Siempre
            `false` con `listed:null`.
        reason:
          type: string
          enum: [WHITELIST_EMPTY]
          description: Solo con `listed:null`.

    AccountLookupResult:
      type: object
      required: [by, documentKind, matches, count, truncated, importedAt]
      properties:
        by:
          type: string
          enum: [document]
        documentKind:
          type: string
          enum: [CEDULA, RUC, OTRO]
          description: CEDULA (10 dígitos), RUC (13) u OTRO (se buscó tal cual).
        matches:
          type: array
          description: >
            Máximo 50. Orden: ACTIVO > SUSPENDIDO > ORDENADO > PENDIENTE, luego
            por número de cuenta. Nunca incluye el documento.
          items:
            type: object
            required: [accountNumber, status]
            properties:
              accountNumber: { type: string }
              status: { type: string, enum: [ACTIVO, SUSPENDIDO, ORDENADO, PENDIENTE] }
              city: { type: string, nullable: true }
              node: { type: string, nullable: true }
              businessType: { type: string, nullable: true }
              accountType: { type: string, nullable: true }
              accessType: { type: string, nullable: true }
              fullName:
                type: string
                nullable: true
                description: Nombre según la planilla Xtrim (para que el técnico elija la cuenta).
        count: { type: integer }
        truncated:
          type: boolean
          description: Hay más de 50 cuentas con ese documento; se recortó la lista.
        importedAt:
          type: string
          format: date-time
          nullable: true
        reason:
          type: string
          enum: [WHITELIST_EMPTY]
          description: Solo si la whitelist nunca se importó.

    NapPort:
      type: object
      properties:
        portNumber:
          type: integer
        occupied:
          type: boolean
        clientAccountNumber:
          type: string
          nullable: true
          description: Cuenta del cliente en el puerto; `null` si está libre.
        equipmentId:
          type: string
          nullable: true
          description: Serial/ID GPON del equipo conectado. `null` si no vino.
          example: ZTEGD52E1A9B
        clientStatus:
          $ref: '#/components/schemas/AccountStatusCode'
        statusPending:
          type: boolean
          description: >
            `true` en los puertos ocupados cuyo estado todavía no se consultó.
            Se resuelven con `POST /accounts/status-batch` (paso 2).

    NapPorts:
      type: object
      properties:
        napRef:
          type: string
          description: Valor tal como llegó en la ruta (id numérico o código de NAP).
        napId:
          type: integer
          nullable: true
        napCode:
          type: string
          nullable: true
        ports:
          type: array
          description: Vacío cuando `detailAvailable` es false (camino TEC).
          items:
            $ref: '#/components/schemas/NapPort'
        detailAvailable:
          type: boolean
          description: >
            false por el camino TEC: esa API solo publica el conteo
            ocupados/total en el listado de NAPs (el detalle vive en
            tec.grupotvcable.com/Gpon/Coverage, que aún no es API). Con FSM y un
            `napId` numérico es true.
        occupiedPorts:
          type: integer
        totalPorts:
          type: integer
          description: >
            Se toma del `ports` de `/naps/nearest` memorizado. Si no se conoce,
            se aplica la regla oficial de la operadora (2026-09-09): una NAP
            tiene 8 puertos, o 16 si hay más de 8 ocupados (máximo absoluto 16).
            Por el camino FSM la rejilla `ports` sale siempre completa
            (ocupados + libres).
        note:
          type: string
          description: Explicación para mostrar al técnico cuando no hay detalle.
        statusFanOut:
          type: object
          description: Cuántos estados quedan por resolver y con qué tope (paso 2).
          properties:
            supported:
              type: boolean
              description: false por el camino TEC.
            pendingAccounts:
              type: integer
            batchLimit:
              type: integer
              example: 12
        source:
          type: string
          enum: [FSM, TEC]
        degraded:
          $ref: '#/components/schemas/Degraded'

    StatusBatchRequest:
      type: object
      required: [accounts]
      properties:
        accounts:
          type: array
          description: >
            Cuentas a consultar. Los duplicados se deduplican en silencio.
            Más de `batchLimit` (12) es un 400.
          minItems: 1
          maxItems: 12
          items:
            type: string
            minLength: 1
          example: ['35070291', '71398253', '40012345']

    StatusBatchResponse:
      type: object
      properties:
        brand:
          type: string
          enum: [telenews, seteinfo]
        items:
          type: array
          description: >
            Conserva el orden de entrada, con exactamente un elemento por cuenta
            única.
          items:
            type: object
            properties:
              accountNumber:
                type: string
              status:
                allOf:
                  - $ref: '#/components/schemas/AccountStatus'
                nullable: true
              statusCode:
                $ref: '#/components/schemas/AccountStatusCode'
              statusDescription:
                type: string
                nullable: true
              error:
                type: string
                nullable: true
                description: Motivo del fallo de ESA cuenta. Un fallo aislado no tumba el lote.
        requested:
          type: integer
          description: Cuentas únicas efectivamente consultadas.
        resolved:
          type: integer
        failed:
          type: integer

    FsmHealth:
      type: object
      description: Estado de la integración FSM. No implica ninguna llamada a la operadora.
      properties:
        mode:
          type: string
          enum: [mock, real]
          description: Valor efectivo de `connectorMode('fsm')`.
        defaultBrand:
          type: string
          example: telenews
        napsPrimarySource:
          type: string
          enum: [fsm, tec]
        brands:
          type: array
          items:
            type: object
            properties:
              brand:
                type: string
                enum: [telenews, seteinfo]
              available:
                type: boolean
              reason:
                type: string
                nullable: true
                enum: [MISSING, EXPIRED, REJECTED, null]
              tokenSource:
                type: string
                nullable: true
                enum: [STATIC, CLIENT_CREDENTIALS, null]
              expiresAt:
                type: string
                format: date-time
                nullable: true
              expiresInSeconds:
                type: integer
                nullable: true
                description: Negativo si el token ya venció.

    FlatField:
      type: object
      description: Campo suelto de la ficha del terminal, tal como lo nombra ISP Monitor.
      properties:
        key:
          type: string
        path:
          type: string
          description: Ruta completa cuando el campo venía anidado (`evento.descripcion`).
        value:
          nullable: true
          oneOf:
            - type: string
            - type: number
            - type: boolean

    TerminalHistoryEntry:
      type: object
      description: >
        Equipos que pasaron por ese puerto en un período. Sale de `terminals[]`
        de la API y le sirve al técnico para ver si el equipo anterior del
        domicilio venía cayéndose.
      properties:
        period:
          type: string
          description: LastHour | LastDay | LastWeek | LastMonth, tal como lo nombra la operadora.
          example: LastMonth
        ids:
          type: array
          items:
            type: string
          example: [ZTEGD0BB8294, ZTEGD3F9BBE5]
        statuses:
          type: array
          description: Estado de cada equipo de `ids`, en el mismo orden (`up` / `down`).
          items:
            type: string
          example: [down, up]
        drop:
          type: string
          nullable: true
        events:
          type: string
          nullable: true

    TerminalSnapshot:
      type: object
      description: >
        Estado puntual del equipo y evento asociado. Shape verificado contra la
        API real el 2026-08-26 con un ONT ZTE activo.
      properties:
        id:
          type: string
          example: ZTEGD3F9BBE5
        found:
          type: boolean
          description: false cuando ISP Monitor no tiene datos para ese identificador (204).
        online:
          type: boolean
          nullable: true
          description: Estado del equipo del cliente; sale del campo `status` de la API (`up` / `down`).
        technology:
          type: string
          nullable: true
          enum: [GPON, HFC]
        technologySource:
          $ref: '#/components/schemas/TechnologySource'
        city:
          type: string
          nullable: true
          example: Quito
        networkIds:
          type: array
          description: >
            Identificadores de la red de acceso a la que cuelga el equipo. NO es
            un nodo: la operadora aclaró (2026-08-27) que estos datos se toman
            de una tarjeta de CMTS (HFC — puede cubrir un ramal, un nodo o una
            combinación) o de un puerto de OLT (GPON — un hilo de fibra).
          items:
            type: integer
          example: [9198]
        event:
          type: object
          nullable: true
          description: >
            Evento (daño) asociado. `active` es false cuando el campo `events`
            de la API viene vacío o null.
          properties:
            active:
              type: boolean
            description:
              type: string
              nullable: true
        drop:
          type: object
          description: >
            Caída de red detectada por el sistema de monitoreo de la operadora
            (campo `drop` de la API). Es el único campo "extra" de la ficha que
            la operadora confirmó relevante (2026-08-27); `device`, `ifIndex` e
            `index` son internos del monitoreo y no se exponen en `fields`.
          properties:
            detected:
              type: boolean
            description:
              type: string
              nullable: true
        history:
          type: array
          items:
            $ref: '#/components/schemas/TerminalHistoryEntry'
        fields:
          type: array
          description: >
            Resto de la ficha aplanada, sin repetir lo que ya tiene campo propio
            ni los campos internos del monitoreo (`device`, `ifIndex`, `index`),
            que siguen disponibles en `raw`.
          items:
            $ref: '#/components/schemas/FlatField'
        raw:
          description: Payload original de la API de operadora.
          nullable: true
        fetchedAt:
          type: string
          format: date-time

    SeriesPoint:
      type: object
      properties:
        t:
          type: string
          nullable: true
          description: >
            Instante de la muestra en ISO-8601. Si la operadora manda un
            formato no parseable se devuelve el texto original; null si la
            serie no trae marca de tiempo.
        values:
          type: object
          description: Métricas numéricas de la muestra, por nombre de clave.
          additionalProperties:
            type: number
        meta:
          type: object
          description: Campos no numéricos de la muestra (estado, descripción…).
          additionalProperties:
            type: string

    SeriesChannel:
      type: object
      description: >
        Canal de una métrica desglosada. Los endpoints DOCSIS de SNR y
        codewords devuelven una entrada por canal upstream del cablemódem,
        cada una con su propia serie.
      properties:
        label:
          type: string
          description: Nombre del canal (`desc` de la operadora).
          example: Logical Upstream Channel 0/1.1/0
        network:
          type: string
          nullable: true
          example: 2G-2 v
        ifIndex:
          type: integer
          nullable: true
          example: 5000018
        keys:
          type: array
          items:
            type: string
        points:
          type: array
          items:
            $ref: '#/components/schemas/SeriesPoint'

    Series24h:
      type: object
      description: >
        Serie de las últimas 24 horas ya normalizada. La operadora la devuelve
        como tuplas `[[epochSegundos, valor], …]` — 288 muestras, una cada 5
        minutos — sin nombrar las columnas; el backend les pone nombre según la
        métrica y el ámbito:
        `terminal/status` → `online` (1 = en línea, 0 = caído);
        `network/status` → `terminalsOnline` (cuántos equipos de la misma red de
        acceso están en línea, **no** un 0/1; la operadora no publica el total de
        la red, así que no se puede derivar un porcentaje);
        `snr` → `snr` o `snrDown`/`snrUp` según cuántas columnas traiga;
        `codewords` → `errors` o `corrected`/`uncorrected`.
        Las métricas DOCSIS llegan además desglosadas por canal upstream: la
        respuesta es un array de canales, cada uno con su `data` — ver
        `channels`.
        La ventana es siempre de 24 horas contadas desde el instante de la
        consulta; la cantidad de muestras varía según el equipo (se observaron
        entre 122 y 292), así que los promedios deben ponderarse por tiempo, no
        por muestra.
        Las series de SNR y codewords son DOCSIS: en equipos GPON la operadora
        responde 204, por lo que `/diagnostics` directamente no las consulta
        (ver `skipped`).
        Si el formato no se reconoce, `recognized` es false y el consumidor
        puede caer a `raw`.
      properties:
        id:
          type: string
        scope:
          type: string
          enum: [terminal, network]
        metric:
          type: string
          enum: [status, snr, codewords]
        keys:
          type: array
          description: Nombres de las series numéricas presentes (leyenda del gráfico).
          items:
            type: string
        points:
          type: array
          items:
            $ref: '#/components/schemas/SeriesPoint'
        channels:
          type: array
          description: >
            Canales cuando la métrica viene desglosada (SNR y codewords DOCSIS
            traen una serie por canal upstream). Vacío si la métrica es de un
            solo canal; en ese caso `keys`/`points` son la serie. Cuando hay
            canales, `keys` y `points` reflejan el primero, para consumidores
            que no los manejen.
          items:
            $ref: '#/components/schemas/SeriesChannel'
        recognized:
          type: boolean
        raw:
          description: Payload original de la API de operadora.
          nullable: true
        fetchedAt:
          type: string
          format: date-time

    ScopedSeries:
      type: object
      description: La misma métrica para el equipo del cliente y para la red.
      properties:
        terminal:
          allOf:
            - $ref: '#/components/schemas/Series24h'
          nullable: true
        network:
          allOf:
            - $ref: '#/components/schemas/Series24h'
          nullable: true

    TerminalDiagnostics:
      type: object
      description: >
        Ficha del equipo más las series de 24 horas que apliquen (campos 9-12).
        No siempre son seis: ver `skipped`.
      properties:
        id:
          type: string
        terminal:
          $ref: '#/components/schemas/TerminalSnapshot'
        status:
          $ref: '#/components/schemas/ScopedSeries'
        snr:
          $ref: '#/components/schemas/ScopedSeries'
        codewords:
          $ref: '#/components/schemas/ScopedSeries'
        errors:
          type: array
          description: Endpoints upstream que fallaron; el resto del payload sigue siendo válido.
          items:
            type: object
            properties:
              endpoint:
                type: string
                example: network/snr
              message:
                type: string
        skipped:
          type: array
          description: >
            Endpoints que deliberadamente NO se consultaron, y por qué. La
            operadora pidió no consultar datos "sin definir cuándo hacen falta"
            y no existe ambiente de pruebas: en GPON las cuatro series DOCSIS
            (SNR y codewords, terminal y red) no se piden, y si el identificador
            no existe no se pide ninguna serie.
          items:
            type: object
            properties:
              endpoint:
                type: string
                example: terminal/snr
              reason:
                type: string
        window:
          type: object
          description: Ventana que cubren las series, siempre 24 h hacia atrás desde `until`.
          properties:
            hours:
              type: integer
              enum: [24]
            until:
              type: string
              format: date-time
        fetchedAt:
          type: string
          format: date-time
        technology:
          type: string
          nullable: true
          enum: [HFC, GPON]
          description: Decide qué bloque viene lleno (`docsis` o `gpon`). `null` si el equipo no se encontró.
        technologySource:
          $ref: '#/components/schemas/TechnologySource'
        simulated:
          type: boolean
          description: true si TODO el payload es simulado (conector ISP Monitor en mock).
        docsis:
          allOf: [{ $ref: '#/components/schemas/DocsisMetrics' }]
          nullable: true
        gpon:
          allOf: [{ $ref: '#/components/schemas/GponMetrics' }]
          nullable: true
        outages:
          $ref: '#/components/schemas/OutageSummary'
        uptime:
          $ref: '#/components/schemas/Uptime'

    TechnologySource:
      type: string
      enum: [ISP_MONITOR, HINT, ID_FORMAT, UNKNOWN]
      description: >
        Cómo se decidió la tecnología: `ISP_MONITOR` (la ficha trae `type`
        explícito, siempre manda), `HINT` (`?technology=` del cliente), `ID_FORMAT`
        (MAC 12-hex → HFC; serial de vendor ZTEG/HWTC/… → GPON) o `UNKNOWN`.

    MetricSource:
      type: string
      enum: [ISP_MONITOR, SIMULATED, NONE]

    Health:
      type: string
      enum: [OK, WARNING, CRITICAL, UNKNOWN]
      description: Evaluación contra `thresholds`. Equipo caído → CRITICAL.

    DocsisChannel:
      type: object
      properties:
        channelId: { type: string, description: ifIndex real o DS1..DS4 / US1..US2 simulado }
        direction: { type: string, enum: [downstream, upstream] }
        label: { type: string }
        frequencyMHz: { type: number, nullable: true }
        powerDbmv: { type: number, nullable: true }
        snrDb: { type: number, nullable: true }
        modulation: { type: string, nullable: true }
        simulatedFields:
          type: array
          items: { type: string }
          description: Campos de ESTE canal que son simulados.

    DocsisMetrics:
      type: object
      description: >
        Solo HFC. Potencias (dBmV) y todo el downstream son SIMULADOS; SNR
        upstream por canal y FEC salen de ISP Monitor en modo real. Valores
        `null` si el cablemódem está caído.
      properties:
        technology: { type: string, enum: [HFC] }
        simulated: { type: boolean, description: true si algún valor del bloque es simulado (hoy siempre). }
        sources:
          type: object
          properties:
            snrUpstream: { $ref: '#/components/schemas/MetricSource' }
            snrDownstream: { $ref: '#/components/schemas/MetricSource' }
            power: { $ref: '#/components/schemas/MetricSource' }
            codewords: { $ref: '#/components/schemas/MetricSource' }
        downstream:
          type: object
          properties:
            powerDbmv: { type: number, nullable: true, description: Promedio de canales. }
            snrDb: { type: number, nullable: true }
            channels: { type: array, items: { $ref: '#/components/schemas/DocsisChannel' } }
        upstream:
          type: object
          properties:
            powerDbmv: { type: number, nullable: true }
            snrDb: { type: number, nullable: true }
            channels: { type: array, items: { $ref: '#/components/schemas/DocsisChannel' } }
        codewords:
          type: object
          description: Último valor de 24 h; el peor canal.
          properties:
            correctedPercent: { type: number, nullable: true }
            uncorrectedPercent: { type: number, nullable: true }
        thresholds:
          type: object
          properties:
            downstreamPowerDbmv: { type: object, properties: { min: { type: number }, max: { type: number } } }
            downstreamSnrDbMin: { type: number }
            upstreamPowerDbmv: { type: object, properties: { min: { type: number }, max: { type: number } } }
            upstreamSnrDbMin: { type: number }
            uncorrectedPercentMax: { type: number }
        health: { $ref: '#/components/schemas/Health' }
        measuredAt: { type: string, format: date-time }

    GponMetrics:
      type: object
      description: >
        Solo GPON (ONT/ONU/XPON). La capa óptica, OLT/puerto PON/ONU id,
        distancia, temperatura, voltaje y corriente de bias son SIMULADOS
        (ISP Monitor no los publica). `onu.state` y `olt.accessNetworkIds`
        salen de la ficha real en modo real. Valores ópticos `null` si la ONU
        está caída.
      properties:
        technology: { type: string, enum: [GPON] }
        simulated: { type: boolean }
        sources:
          type: object
          properties:
            optical: { $ref: '#/components/schemas/MetricSource' }
            onuState: { $ref: '#/components/schemas/MetricSource' }
            accessNetwork: { $ref: '#/components/schemas/MetricSource' }
            oltTopology: { $ref: '#/components/schemas/MetricSource' }
        onu:
          type: object
          properties:
            serial: { type: string }
            onuId: { type: integer }
            state: { type: string, enum: [ONLINE, OFFLINE, LOS, DYING_GASP, UNKNOWN] }
            stateLabel: { type: string }
        olt:
          type: object
          properties:
            name: { type: string }
            ponPort: { type: string, description: frame/slot/port }
            accessNetworkIds: { type: array, items: { type: integer } }
        optical:
          type: object
          properties:
            rxPowerDbm: { type: number, nullable: true, description: Potencia recibida en el ONT. }
            txPowerDbm: { type: number, nullable: true, description: Potencia transmitida por el ONT. }
            oltRxPowerDbm: { type: number, nullable: true, description: Potencia del ONT recibida en la OLT. }
        distanceMeters: { type: integer, nullable: true, description: Ranging OLT→ONT. }
        temperatureC: { type: number, nullable: true }
        voltageV: { type: number, nullable: true }
        biasCurrentMa: { type: number, nullable: true }
        thresholds:
          type: object
          description: Clase B+ (ITU-T G.984.2).
        health: { $ref: '#/components/schemas/Health' }
        measuredAt: { type: string, format: date-time }

    OutageEvent:
      type: object
      properties:
        startedAt: { type: string, format: date-time, description: 'Primera muestra caída (UTC, `…Z`).' }
        startedAtLocal: { type: string, description: 'Mismo instante en hora de Ecuador con offset (`…-05:00`).' }
        endedAt: { type: string, format: date-time, nullable: true, description: Primera muestra de vuelta en línea; null si sigue caído. }
        endedAtLocal: { type: string, nullable: true }
        durationSeconds: { type: integer, description: Si sigue caído, hasta el momento de la consulta. }
        ongoing: { type: boolean }
        cause: { type: string, enum: [LOS, DYING_GASP, T3_TIMEOUT, T4_TIMEOUT, POWER_LOSS, UNKNOWN] }
        causeLabel: { type: string }
        precisionSeconds: { type: integer, description: Resolución de la serie (300 s en ISP Monitor). }
        simulated: { type: boolean }

    OutageSummary:
      type: object
      properties:
        source: { $ref: '#/components/schemas/MetricSource' }
        causeSource: { $ref: '#/components/schemas/MetricSource' }
        simulated: { type: boolean }
        timezone: { type: string, example: America/Guayaquil }
        window:
          type: object
          properties:
            from: { type: string, format: date-time, nullable: true }
            until: { type: string, format: date-time }
            hours: { type: integer, enum: [24] }
        count: { type: integer }
        totalDownSeconds: { type: integer }
        items:
          type: array
          description: La más reciente primero.
          items: { $ref: '#/components/schemas/OutageEvent' }

    Uptime:
      type: object
      properties:
        seconds: { type: integer, nullable: true, description: null si está caído o sin datos. }
        since: { type: string, format: date-time, nullable: true }
        sinceLocal: { type: string, nullable: true }
        lowerBound: { type: boolean, description: 'true → sin caídas en la ventana; en línea AL MENOS `seconds`.' }
        source: { $ref: '#/components/schemas/MetricSource' }

    SignalLevels:
      type: object
      description: Niveles de señal RX y TX.
      properties:
        rxDbm:
          type: number
          format: double
        txDbm:
          type: number
          format: double

    NetworkMetrics:
      type: object
      description: Métricas de red del cliente (campos 9-13).
      properties:
        accountNumber:
          type: string
        technology:
          type: string
          enum: [GPON, HFC]
        signalLevels:
          $ref: '#/components/schemas/SignalLevels'
        signalToNoiseDb:
          type: number
          format: double
          description: Señal a ruido, solo HFC (campo 10).
        fecCorrectedPercent:
          type: number
          format: double
          description: FEC corregidos, solo HFC (campo 11).
        fecUncorrectedPercent:
          type: number
          format: double
          description: FEC sin corregir, solo HFC (campo 11).
        outagesLast24h:
          type: integer
          description: Caídas en las últimas 24 horas (campo 12).
        trafficMbpsIn:
          type: number
          format: double
          description: Tráfico de entrada (campo 13).
        trafficMbpsOut:
          type: number
          format: double
          description: Tráfico de salida (campo 13).
        measuredAt:
          type: string
          format: date-time

    NodeEvent:
      type: object
      description: >
        Evento o daño de la red de acceso que da servicio a la cuenta
        (campo 14). El nombre del esquema conserva el término del contrato
        publicado; ver la nota en `/accounts/{accountNumber}/node-events`.
      properties:
        type:
          type: string
        description:
          type: string
        status:
          type: string
          enum: [RESUELTO, PENDIENTE, FALLA]
        occurredAt:
          type: string
          format: date-time

    LanDevice:
      type: object
      description: Equipo en la tabla DHCP (campo 19).
      properties:
        hostname:
          type: string
        ipAddress:
          type: string
        macAddress:
          type: string
        leaseExpiresAt:
          type: string
          format: date-time

    WifiDevice:
      type: object
      description: Dispositivo conectado por WiFi (campo 20).
      properties:
        hostname:
          type: string
        macAddress:
          type: string
        band:
          type: string
          enum: ['2.4GHz', '5GHz']
        signalDbm:
          type: number
          format: double

    WifiBandConfig:
      type: object
      properties:
        band:
          type: string
          enum: ['2.4GHz', '5GHz']
        ssid:
          type: string

    WifiConfig:
      type: object
      properties:
        accountNumber:
          type: string
        bands:
          type: array
          items:
            $ref: '#/components/schemas/WifiBandConfig'

    WifiConfigUpdate:
      type: object
      description: Cambio de SSID y contraseña (campo 21).
      required: [bands]
      properties:
        bands:
          type: array
          minItems: 1
          items:
            type: object
            required: [band, ssid]
            properties:
              band:
                type: string
                enum: ['2.4GHz', '5GHz']
              ssid:
                type: string
              password:
                type: string
                format: password
                description: Nueva contraseña. Omitir para no cambiarla.

    # ---- Tareas y visitas (campos 15-16) -----------------------------

    ClosedTask:
      type: object
      description: Tarea o visita cerrada, con su observación de cierre.
      properties:
        taskId:
          type: string
          description: >
            Id de la tarea. En `previous-visits` se usa el `workOrder` mientras
            no haya tareas cargadas: es lo que el técnico ve.
          example: TASK/294328/2026
        workOrder:
          type: string
          nullable: true
          description: Orden a la que pertenece. Se usa para pedir sus notas.
          example: ORDER/424900/2026
        occurredAt:
          type: string
          format: date-time
        reason:
          type: string
          description: Motivo. `""` si la operadora no lo trajo.
        closingNotes:
          type: string
          description: >
            Observación de cierre: concatenación de las notas de la tarea
            separadas por " · ". `""` mientras `notesLoaded` sea false.
        technician:
          type: string
          nullable: true
          description: >
            Técnico que cerró la tarea. Sale de `lastModifyUser` de
            `/workorder/tasks`, que la operadora expuso el 2026-09-09. Es `null`
            en `previous-visits` (esa lista no abre las tareas: aparece al
            expandir la visita, con `notesLoaded: true`) y en tareas sin cerrar.
        result:
          type: string
          enum: [SATISFACTORIA, INSATISFACTORIA, PENDIENTE]
          description: >
            Valor **inferido** por el backend a partir del `status` y de las
            notas: `PENDIENTE` si la tarea no terminó, `INSATISFACTORIA` si
            alguno contiene una palabra de `FSM_UNSATISFACTORY_KEYWORDS`,
            `SATISFACTORIA` en cualquier otro caso. La operadora confirmó el
            2026-09-09 que hoy es la ÚNICA forma de saberlo —no hay campo
            directo— y que está gestionando exponerlo.
        notesLoaded:
          type: boolean
          description: >
            false cuando las notas todavía no se cargaron (respuesta de
            `previous-visits`). El cliente lo usa para saber que hay que llamar
            a `GET /workorders/tasks?workOrder=`.

    PreviousVisits:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ClosedTask'
        totalOrders:
          type: integer
        brand:
          type: string
          enum: [telenews, seteinfo]
        degraded:
          $ref: '#/components/schemas/Degraded'

    UnsatisfactoryTasks:
      type: object
      properties:
        items:
          type: array
          description: Solo tareas cuyo `result` es INSATISFACTORIA.
          items:
            $ref: '#/components/schemas/ClosedTask'
        scanned:
          type: integer
          description: Órdenes finalizadas cuyas notas se leyeron.
        totalOrders:
          type: integer
          description: Órdenes totales de la cuenta.
        truncated:
          type: boolean
          description: true cuando `totalOrders > scanned`.
        brand:
          type: string
          enum: [telenews, seteinfo]
        degraded:
          $ref: '#/components/schemas/Degraded'

    VisitItem:
      type: object
      description: Una orden de trabajo de la cuenta vista como visita, con su resultado.
      required:
        [taskId, workOrder, occurredAt, reason, closingNotes, technician, result, notesLoaded]
      properties:
        taskId:
          type: string
          description: Igual a `workOrder` (la lista es por orden, no por tarea).
          example: ORDER/73198/2019
        workOrder:
          type: string
          example: ORDER/73198/2019
        occurredAt:
          type: string
          format: date-time
          description: >
            `PENDIENTE`: fecha de creación de la orden. Resto: fecha de fin (o
            de creación si FSM no trajo fin). ISO-8601 UTC.
        reason:
          type: string
          description: Campo `task` de la orden. `""` si la operadora no lo trajo.
        closingNotes:
          type: string
          description: >
            Notas unidas por " · ". INSATISFACTORIA: las de las tareas
            insatisfactorias; SATISFACTORIA: las de la última tarea cerrada.
            `""` cuando `notesLoaded` es false.
        technician:
          type: string
          nullable: true
          description: >
            `lastModifyUser` de la tarea de la que salen las notas. `null`
            cuando `notesLoaded` es false.
        result:
          type: string
          enum: [PENDIENTE, SATISFACTORIA, INSATISFACTORIA, CANCELADA, REALIZADA]
          description: >
            Ver la descripción de `GET /accounts/{accountNumber}/visits`.
            SATISFACTORIA/INSATISFACTORIA son **inferidos** de las notas
            (`FSM_UNSATISFACTORY_KEYWORDS`); REALIZADA = finalizada sin
            verificar.
        notesLoaded:
          type: boolean
          description: >
            true solo en SATISFACTORIA/INSATISFACTORIA. En el resto el cliente
            puede pedir las notas con `GET /workorders/tasks?workOrder=`.
        createdAt:
          type: string
          format: date-time
          nullable: true
          description: Creación de la orden (UTC). Abre la ventana de la visita.
        endedAt:
          type: string
          format: date-time
          nullable: true
          description: Fin de la orden (UTC); null si sigue pendiente.
        fsmTaskId:
          type: string
          nullable: true
          description: >
            Tarea FSM de la orden (`TASK/294328/2026`) si `/account/process` la
            trae. Junto con `workOrder`, es el valor que la app debe mandar como
            `taskId` al guardar un registro durante esta visita.
          example: TASK/109712/2024

    VisitRecords:
      type: object
      properties:
        linkedBy:
          type: string
          nullable: true
          enum: [TASK_ID, TIME_WINDOW, MIXED]
          description: null si la visita no tiene registros.
        window:
          type: object
          nullable: true
          description: Ventana usada para la asociación por tiempo; null en CANCELADA.
          properties:
            from: { type: string, format: date-time }
            until: { type: string, format: date-time }
        checklist:
          type: array
          description: >
            Siempre los 9 tipos, en este orden, con `done` y `count`
            (`clientLocation` = "Ubicación casa cliente", aditivo 2026-09-30;
            `deviceValidation` = "Validación de equipo vs plan", aditivo 2026-10-01).
          items:
            type: object
            properties:
              type:
                type: string
                enum: [speedtest, externalSpeedtest, ping, traceroute, wifiSignal, distance, retiredEquipment, clientLocation, deviceValidation]
              label: { type: string }
              done: { type: boolean }
              count: { type: integer }
        speedtests:
          type: array
          description: App y dispositivo externo (distinguir por `source`). Cada uno trae `linkedBy`.
          items: { $ref: '#/components/schemas/Speedtest' }
        pingTests:
          type: array
          items: { $ref: '#/components/schemas/PingTest' }
        tracerouteTests:
          type: array
          items: { $ref: '#/components/schemas/TracerouteTest' }
        wifiHeatmaps:
          type: array
          description: Mediciones de señal WiFi por habitación y AP.
          items: { $ref: '#/components/schemas/WifiHeatmap' }
        distanceMeasurements:
          type: array
          items: { $ref: '#/components/schemas/DistanceMeasurement' }
        retiredEquipment:
          type: array
          items: { $ref: '#/components/schemas/RetiredEquipment' }
        clientLocations:
          type: array
          description: Capturas "Casa cliente" (aditivo). Cada una trae `linkedBy`.
          items: { $ref: '#/components/schemas/ClientLocation' }
        deviceValidations:
          type: array
          description: Validaciones de equipo vs plan (aditivo 2026-10-01). Cada una trae `linkedBy`.
          items: { $ref: '#/components/schemas/DeviceValidation' }

    VisitsWithRecordsResult:
      allOf:
        - $ref: '#/components/schemas/VisitsResult'
        - type: object
          properties:
            items:
              type: array
              items:
                allOf:
                  - $ref: '#/components/schemas/VisitItem'
                  - type: object
                    properties:
                      records:
                        $ref: '#/components/schemas/VisitRecords'
            recordsSummary:
              type: object
              properties:
                linked: { type: integer, description: Registros de la cuenta asociados a alguna visita. }
                unlinked: { type: integer, description: Registros de la cuenta fuera de toda visita. }
                windowGraceHours: { type: integer, example: 2 }
                windowLookbackHours: { type: integer, example: 72 }

    VisitsResult:
      type: object
      required: [items, pendingCount, totalOrders, scanned, truncated, brand]
      properties:
        items:
          type: array
          description: Pendientes primero (fecha desc), luego el resto por `occurredAt` desc.
          items:
            $ref: '#/components/schemas/VisitItem'
        pendingCount:
          type: integer
          description: Órdenes sin terminar recibidas. Lo esperado es 0 o 1.
        totalOrders:
          type: integer
          description: Órdenes totales de la cuenta.
        scanned:
          type: integer
          description: Órdenes finalizadas (no canceladas) cuyas tareas se abrieron.
        truncated:
          type: boolean
          description: >
            true cuando hay órdenes finalizadas no canceladas que quedaron fuera
            del fan-out (es decir, hay al menos un item `REALIZADA` por límite).
        brand:
          type: string
          enum: [telenews, seteinfo]
        degraded:
          $ref: '#/components/schemas/Degraded'

    AccountOrders:
      type: object
      properties:
        accountNumber:
          type: string
        brand:
          type: string
          enum: [telenews, seteinfo]
        client:
          type: object
          nullable: true
          description: Datos del cliente según la orden más reciente. `null` si no hay órdenes.
          properties:
            names:
              type: string
              nullable: true
            phoneNumber:
              type: string
              nullable: true
            email:
              type: string
              nullable: true
            address:
              type: string
              nullable: true
            latitude:
              type: number
              format: double
              nullable: true
            longitude:
              type: number
              format: double
              nullable: true
        orders:
          type: array
          description: Ordenadas por `createdAt` descendente. Puede ser `[]`.
          items:
            type: object
            properties:
              workOrder:
                type: string
                example: ORDER/424900/2026
              task:
                type: string
                nullable: true
              state:
                type: string
                nullable: true
              externalProcess:
                type: string
                nullable: true
              cpartyId:
                type: string
                nullable: true
              createdAt:
                type: string
                format: date-time
                nullable: true
              endedAt:
                type: string
                format: date-time
                nullable: true
              finished:
                type: boolean
                description: Equivale a `endedAt != null` (`finish_date is not null`).
              note:
                type: string
                nullable: true
              latitude:
                type: number
                format: double
                nullable: true
              longitude:
                type: number
                format: double
                nullable: true
              address:
                type: string
                nullable: true

    WorkOrderTasks:
      type: object
      properties:
        workOrder:
          type: string
          example: ORDER/424900/2026
        brand:
          type: string
          enum: [telenews, seteinfo]
        tasks:
          type: array
          items:
            type: object
            properties:
              taskId:
                type: string
                example: TASK/294328/2026
              status:
                type: string
                nullable: true
                description: Literal de la operadora, sin traducir.
              businessKey:
                type: string
                nullable: true
              createdAt:
                type: string
                format: date-time
                nullable: true
              finishedAt:
                type: string
                format: date-time
                nullable: true
              result:
                type: string
                enum: [SATISFACTORIA, INSATISFACTORIA, PENDIENTE]
                description: Valor inferido por el backend (ver `ClosedTask.result`).
              closedBy:
                type: string
                nullable: true
                description: >
                  Técnico que cerró la tarea (`lastModifyUser`, expuesto por la
                  operadora el 2026-09-09). `null` si la tarea sigue abierta o
                  si la operadora no lo trae.
              notes:
                type: array
                description: Ordenadas por `createdAt` ascendente. Puede ser `[]`.
                items:
                  type: object
                  properties:
                    createdAt:
                      type: string
                      format: date-time
                      nullable: true
                    content:
                      type: string
