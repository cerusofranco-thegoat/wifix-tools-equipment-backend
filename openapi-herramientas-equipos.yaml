  /terminals/{id}/diagnostics:
    get:
      tags: [Diagnóstico de Red]
      summary: Panel completo de ISP Monitor (campos 9-12)
      description: >
        Ficha del equipo más las series de las últimas 24 horas (estado, señal
        a ruido y errores FEC, cada una para el terminal y para la red) en una
        sola llamada.

        Solo se consulta lo que aplica: primero la ficha y, según la tecnología
        que devuelva, las series. En GPON las cuatro series DOCSIS no se piden
        (la operadora responde 204) y en un identificador inexistente no se pide
        ninguna, así que el panel cuesta 3 llamadas upstream en fibra y 7 en
        HFC. Lo omitido se reporta en `skipped`.

        Las series que sí aplican se consultan en paralelo, con un tope global
        de concurrencia y un cache corto (`TEC_API_MAX_CONCURRENCY`,
        `TEC_API_CACHE_TTL_MS`): la operadora no impone un límite de peticiones
        pero pidió no abusar, y todas las consultas van contra producción. Si
        alguna falla, el resto igual se devuelve y el fallo se reporta en
        `errors`.


        **Por tecnología (2026-09-30).** `technology` (`HFC` | `GPON`) decide
        qué bloque viene lleno: `docsis` (HFC: potencias y SNR downstream/
        upstream por canal, FEC) o `gpon` (ONT/ONU: potencia óptica Rx/Tx,
        OLT/puerto PON/ONU id, estado de la ONU, distancia, temperatura,
        voltaje). El otro bloque es `null`: la app NO debe mostrar DOCSIS a un
        ONT. `outages` trae cada caída de las últimas 24 h con inicio y fin en
        UTC (`…Z`) y en hora de Ecuador (`…-05:00`), duración y causa.


        **Real vs simulado.** ISP Monitor publica solo el estado up/down 24 h,
        SNR y FEC upstream (HFC) y la red de acceso. De ahí salen, REALES, las
        caídas (inicio/fin/duración), `uptime`, el SNR upstream por canal y los
        FEC. Las potencias DOCSIS, el downstream y TODA la capa óptica GPON no
        los publica la operadora: van SIMULADOS (deterministas por id) y
        marcados con `simulated: true` y `sources.*: SIMULATED`. La causa de la
        caída (LOS / dying gasp / T3-T4) solo la simula el mock; en real es
        `UNKNOWN`. Con el conector en mock, `simulated: true` en la raíz.
      operationId: getTerminalDiagnostics
      parameters:
        - $ref: '#/components/parameters/TerminalIdPath'
        - $ref: '#/components/parameters/TechnologyHintQuery'
