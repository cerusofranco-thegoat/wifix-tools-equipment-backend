                              measuredAt: '2024-02-29T16:11:30.000Z'
                              linkedBy: TIME_WINDOW
                          tracerouteTests: []
                          wifiHeatmaps: []
                          distanceMeasurements: []
                          retiredEquipment: []
                          clientLocations: []
                          deviceValidations: []
                    pendingCount: 0
                    totalOrders: 1
                    scanned: 1
                    truncated: false
                    brand: telenews
                    recordsSummary: { linked: 2, unlinked: 0, windowGraceHours: 2, windowLookbackHours: 72 }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '502':
          $ref: '#/components/responses/ConnectorError'
        '503':
          $ref: '#/components/responses/UpstreamAuthUnavailable'

  /accounts/{accountNumber}/unsatisfactory-tasks:
    get:
      tags: [Tareas y Visitas]
