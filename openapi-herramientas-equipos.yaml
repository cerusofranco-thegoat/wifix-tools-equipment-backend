  /accounts/{accountNumber}/whitelist:
    get:
      tags: [Datos del Cliente]
      summary: ¿La cuenta está en la whitelist de clientes reales?
      description: >
        Valida la cuenta en "Confirmar cuenta" contra la lista de clientes de la
        operadora, importada por completo con `prisma/import-whitelist.ts` (ver
        DEPLOY.md §10). Solo lee la base propia: cero llamadas a sistemas
        externos.


        El número de cuenta se normaliza (recorte de espacios; si es numérico,
        sin ceros a la izquierda: `035070291` → `35070291`) y la respuesta trae
        el valor normalizado.


        Orden de resolución:

        1. Cuenta en `WHITELIST_EXTRA_ACCOUNTS` (demo) → `listed:true`,
           `source:EXTRA`, `status:ACTIVO`, resto de campos `null`.

        2. Cuenta en la lista importada → `listed:true`, `source:IMPORT`.

        3. Lista importada alguna vez pero sin la cuenta → `listed:false`.

        4. Nunca se importó nada → `listed:null`, `reason:WHITELIST_EMPTY` y
           `enforce:false` sin importar la configuración.


        `enforce` refleja `WHITELIST_ENFORCE`: `true` → la app debe bloquear
        las cuentas `listed:false`; `false` → solo avisar. La cédula/RUC se
        guarda en la base pero **nunca** se devuelve.
      operationId: getAccountWhitelist
      parameters:
        - $ref: '#/components/parameters/AccountNumberPath'
      responses:
        '200':
          description: OK. `listed:false` / `listed:null` NO son errores.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WhitelistCheck'
              examples:
                listed:
                  summary: Listada (lista importada)
