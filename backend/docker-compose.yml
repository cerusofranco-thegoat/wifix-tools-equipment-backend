services:
  postgres:
    image: postgres:15-alpine
    container_name: wifix-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: wifix
      POSTGRES_PASSWORD: wifix
      POSTGRES_DB: wifix_tools
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wifix -d wifix_tools"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: wifix-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: wifixminio
      MINIO_ROOT_PASSWORD: wifixminio123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-bucket-init:
    image: minio/mc:latest
    container_name: wifix-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 wifixminio wifixminio123 &&
      (mc mb local/wifix-media || true) &&
      mc anonymous set download local/wifix-media &&
      echo 'Bucket wifix-media listo.'
      "

volumes:
  postgres-data:
  minio-data:
