  /accounts/{accountNumber}/device-validations:
    post:
      tags: [Validación de Equipo]
      summary: Valida el equipo a instalar contra el plan contratado
      description: >
        El servidor es la fuente de verdad (la app replica la misma regla para
        feedback inmediato). `planMbps` **no** se recibe del cliente: es la
        velocidad de bajada contratada, de la misma fuente que
        `contractedDownloadMbps` de `client-profile` (hoy simulada →
        `planSource: simulated`).


        Regla, en este orden:

        1. Modelo fuera del catálogo homologado (incluye obsoletos) →
           `blocked`, razón `not_in_catalog` (aunque no haya plan).

        2. Sin plan contratado → `unknown_plan` (no bloquea; queda como alerta
           "sin plan").

        3. `ethernetMaxMbps < planMbps` → `blocked`, razón `ethernet`.

        4. `wifiStatus = enabled` y `wifiMaxMbps < planMbps` → `blocked`, razón
           `wifi`. Con `none`/`disabled` solo cuenta Ethernet.

        Igualar el plan es suficiente. Si fallan Ethernet y WiFi vienen las dos
        razones. Sin override.


        **Append-only**: se guardan TODOS los intentos (ok, bloqueados, sin
        plan) con el técnico del JWT; un `blocked` es una alerta para el
        gerente. El modelo se busca sin distinguir mayúsculas/espacios, por
        `model` o `displayName`. `device` y `reasons` son una **foto** al
        validar. `taskId` es opcional como en los demás registros por visita:
        si no viene, `/accounts/{accountNumber}/visits?include=records` lo
        asocia por ventana de tiempo. La cuenta se guarda normalizada. No
        responde 404 por cuenta desconocida (mismo criterio que
        `client-location`: la cuenta ya se validó en "Confirmar cuenta").
      operationId: createDeviceValidation
      parameters:
        - $ref: '#/components/parameters/AccountNumberPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceValidationInput'
            examples:
              barcode:
